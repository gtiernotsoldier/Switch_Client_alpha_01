name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── JVM build (core + agent + adapter:common) ───
  jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with: { java-version: '8', distribution: 'temurin' }
      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.5' }
      - name: Compile
        run: cd SwitchLite && gradle :core:compileKotlin :agent:classes :adapter:common:compileKotlin --no-daemon

  # ─── Injector (Linux) ───
  injector-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build injector
        run: cd SwitchLite/injector && mkdir -p build && cd build && cmake .. && cmake --build .
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with: { name: injector-linux, path: SwitchLite/injector/build/injector }

  # ─── Injector (Windows) ───
  injector-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build injector
        run: cd SwitchLite/injector && mkdir build && cd build && cmake .. && cmake --build . --config Release
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with: { name: injector-windows, path: SwitchLite/injector/build/Release/injector.exe }
