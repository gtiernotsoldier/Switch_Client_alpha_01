name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Core process (Rust) + the JVM side of the IPC boundary ───
  # Both halves have to run in the same job: CoreStubE2ETest spawns the real
  # doppel-core binary and asserts the two sides decide identically, tick for
  # tick. Splitting them across jobs would leave the boundary itself untested.
  core-ipc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Core unit tests and self-check
        run: |
          cd Doppel/core-rs
          cargo test
          cargo run -- --selftest
      - name: Build core binary (the JVM e2e test spawns it)
        run: cd Doppel/core-rs && cargo build
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with: { java-version: '8', distribution: 'temurin' }
      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.5' }
      - name: JVM IPC and maths parity tests
        run: |
          cd Doppel
          gradle :core:test \
            --tests "io.doppel.core.ipc.*" \
            --tests "io.doppel.core.math.*" \
            --no-daemon
      # The e2e test skips itself when no binary is present, so the `jvm` job can
      # run the whole suite without a Rust toolchain. Here the binary exists by
      # construction, which means a skip in *this* job is a bug, not a shortcut.
      # Same failure mode as the e2e skip, applied to every parity fixture.
      # A wrong `golden` path makes the suites fail, but an empty fixture makes
      # them pass vacuously — so assert the row counts were actually consumed.
      - name: Assert the parity fixtures were replayed
        run: |
          for t in VelocityParityTest AimParityTest ClickParityTest MovementParityTest ModuleSessionParityTest; do
            f=Doppel/core/build/test-results/test/TEST-io.doppel.core.ipc.$t.xml
            test -f "$f" || { echo "::error::$t produced no report"; exit 1; }
            grep -q 'tests="0"' "$f" && { echo "::error::$t ran zero cases"; exit 1; }
            grep -q 'skipped="[1-9]' "$f" && { echo "::error::$t skipped cases"; exit 1; }
          done
          f=Doppel/core/build/test-results/test/TEST-io.doppel.core.math.PortableMathParityTest.xml
          test -f "$f" || { echo "::error::PortableMathParityTest produced no report"; exit 1; }
          grep -q 'skipped="[1-9]' "$f" && { echo "::error::PortableMathParityTest skipped cases"; exit 1; }
          echo "parity suites replayed"

      - name: Assert the e2e test ran instead of skipping
        run: |
          f=Doppel/core/build/test-results/test/TEST-io.doppel.core.ipc.CoreStubE2ETest.xml
          test -f "$f" || { echo "::error::e2e test produced no report at $f"; exit 1; }
          if grep -q 'skipped="[1-9]' "$f"; then
            echo "::error::e2e skipped in the job that builds the binary"; exit 1
          fi
          echo "e2e ran: $(grep -o 'tests="[0-9]*"' "$f" | head -1), $(grep -c '<testcase' "$f") case(s)"

  # ─── JVM build (core + agent + adapter:common + adapter:forge:v1_8_9 + fat jar) ───
  jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with: { java-version: '8', distribution: 'temurin' }
      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.5' }
      # The mapping table rotted silently once: ten entries named SRG members
      # that do not exist in 1.8.9, or named a member that exists but is a
      # DIFFERENT method (func_72945_a is getCollidingBoundingBoxes, not
      # getEntitiesWithinAABBExcludingEntity). Every one of them failed closed,
      # so the features died without a symptom. This check is why that cannot
      # happen again unnoticed.
      - name: Verify Forge 1.8.9 mapping table
        run: node Doppel/scripts/verify_mappings.mjs
      - name: Compile
        run: cd Doppel && gradle :core:compileKotlin :agent:classes :adapter:common:compileKotlin :adapter:forge:v1_8_9:compileKotlin --no-daemon
      - name: Build agent fat jar
        run: cd Doppel && gradle :agent:jar --no-daemon
      - name: Validate agent.jar
        run: |
          JAR=$(ls Doppel/agent/build/libs/doppel-agent-*.jar | head -1)
          echo "Validating: $JAR"
          SIZE=$(wc -c < "$JAR")
          echo "Size: $SIZE bytes"
          if [ "$SIZE" -lt 1000000 ]; then
            echo "ERROR: agent.jar is too small ($SIZE bytes). Fat jar likely broken."
            exit 1
          fi
          if ! jar tf "$JAR" | grep -q "io/doppel/adapter/common/api/EventBridge"; then
            echo "ERROR: EventBridge.class not found in fat jar. Class merging broken."
            exit 1
          fi
          # Value types live in :contract now (split out of :core), the IPC
          # transport and the safety wrapper in :ipc / :safety. All three must be
          # in the artifact even though :core itself is scheduled to leave it.
          if ! jar tf "$JAR" | grep -q "io/doppel/contract/model/PlayerState"; then
            echo "ERROR: PlayerState.class not found in fat jar. :contract not included."
            exit 1
          fi
          if ! jar tf "$JAR" | grep -q "io/doppel/ipc/CoreStub"; then
            echo "ERROR: CoreStub.class not found in fat jar. :ipc not included."
            exit 1
          fi
          if ! jar tf "$JAR" | grep -q "io/doppel/safety/SafetyWrapper"; then
            echo "ERROR: SafetyWrapper.class not found in fat jar. :safety not included."
            exit 1
          fi
          if ! jar tf "$JAR" | grep -q "io/doppel/adapter/forge/v1_8_9/ForgeBootstrap"; then
            echo "ERROR: ForgeBootstrap.class not found in fat jar. Forge adapter not included!"
            exit 1
          fi
          if ! jar tf "$JAR" | grep -q "io/doppel/agent/MappingContext"; then
            echo "ERROR: MappingContext.class not found in fat jar. Core mapping broken."
            exit 1
          fi
          # Render pipeline bridge classes — REQUIRED for the Display.update() hook.
          # Transformer injects a call to RenderBridge; RenderBridge delegates to
          # ForgeBootstrap.render(). If RenderBridge is missing, the hook compiles but
          # fails at runtime with ClassNotFoundException (silently swallowed).
          if ! jar tf "$JAR" | grep -q "io/doppel/agent/RenderBridge"; then
            echo "ERROR: RenderBridge.class not found in fat jar. Render bridge missing!"
            exit 1
          fi
          # ASM is referenced by Transformer.class at load time. If it's missing from the
          # fat jar, the JVM fails with NoClassDefFoundError: org/objectweb/asm/ClassReader
          # the moment Transformer is first touched (same failure shape Javassist used to
          # produce, which is why this check exists at all).
          if ! jar tf "$JAR" | grep -q "org/objectweb/asm/ClassReader"; then
            echo "ERROR: org/objectweb/asm/ClassReader not found in fat jar. ASM dependency missing!"
            exit 1
          fi
          echo "agent.jar validation passed. All modules + render bridge present."
      - name: Run tests
        run: cd Doppel && gradle :core:test :adapter:common:test :agent:test --no-daemon
      - name: Compile summary
        if: always()
        run: |
          echo "## Compile Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Module | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| core | :white_check_mark: |" >> $GITHUB_STEP_SUMMARY
          echo "| agent | :white_check_mark: |" >> $GITHUB_STEP_SUMMARY
          echo "| adapter:common | :white_check_mark: |" >> $GITHUB_STEP_SUMMARY
          echo "| adapter:forge:v1_8_9 | :white_check_mark: |" >> $GITHUB_STEP_SUMMARY
      - name: Upload agent.jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: doppel-agent-jar
          path: Doppel/agent/build/libs/doppel-agent-*.jar

  # ─── Injector (Windows) ───
  injector:
    runs-on: windows-latest
    needs: jvm
    steps:
      - uses: actions/checkout@v4
      - name: Download agent.jar from jvm job
        uses: actions/download-artifact@v4
        with:
          name: doppel-agent-jar
          path: _temp_agent_jar
      - name: Copy agent.jar into injector resources (overwrite 0-byte git placeholder)
        shell: pwsh
        run: |
          $src = Get-ChildItem -Path _temp_agent_jar -Recurse -Filter "*.jar" | Select-Object -First 1
          if (-not $src) { Write-Error "No jar found in downloaded artifact"; exit 1 }
          Write-Host "Found artifact jar: $($src.FullName) ($($src.Length) bytes)"
          # Overwrite the 0-byte git placeholder
          Copy-Item $src.FullName -Destination "Doppel\injector\resources\agent.jar" -Force
          $dest = Get-Item "Doppel\injector\resources\agent.jar"
          Write-Host "agent.jar ready: $($dest.Length) bytes"
          if ($dest.Length -lt 1000000) { Write-Error "agent.jar too small"; exit 1 }
          Remove-Item _temp_agent_jar -Recurse -Force
      - name: Set up JDK 8 (for jni.h in payload build)
        uses: actions/setup-java@v4
        with: { java-version: '8', distribution: 'temurin' }
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build C++ payload.dll (cmake)
        shell: pwsh
        run: |
          cd Doppel/injector
          mkdir -Force -Path payload-build | Out-Null
          cmake -S src/payload -B payload-build -DCMAKE_BUILD_TYPE=Release
          cmake --build payload-build --config Release
          $dll = Get-ChildItem -Path payload-build -Recurse -Filter "payload.dll" | Select-Object -First 1
          if (-not $dll) { Write-Error "payload.dll not built"; exit 1 }
          Copy-Item $dll.FullName -Destination "resources\payload.dll" -Force
          Write-Host "payload.dll ready: $((Get-Item 'resources\payload.dll').Length) bytes"
      - name: Build Rust injector (cargo)
        run: |
          cd Doppel/injector
          cargo build --release
      - name: Show build info
        shell: pwsh
        run: |
          echo "Commit: ${{ github.sha }}"
          echo "Build time: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss UTC')"
          $exe = "Doppel\injector\target\release\doppel-injector.exe"
          if (Test-Path $exe) { echo "doppel-injector.exe: $((Get-Item $exe).Length) bytes" } else { echo "WARNING: doppel-injector.exe not found" }
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: doppel-injector
          path: Doppel/injector/target/release/doppel-injector.exe

  # ─── External HUD overlay (Windows, Rust) ───
  # The HUD was moved out of the JVM because sharing the GL state machine with the game
  # is what kept breaking it. This job exists so the new crate can never rot the way the
  # Fabric adapter did: it is compiled on every push, whether or not anything uses it yet.
  hud:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build HUD overlay (cargo)
        run: |
          cd Doppel/hud
          cargo build --release
      - name: Show build info
        shell: pwsh
        run: |
          $dir = "Doppel\hud\target\release"
          $exe = Get-ChildItem -Path $dir -Filter "*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { Write-Error "no HUD executable produced in $dir"; exit 1 }
          Write-Host "HUD binary: $($exe.Name) ($($exe.Length) bytes)"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: doppel-hud
          path: Doppel/hud/target/release/*.exe
