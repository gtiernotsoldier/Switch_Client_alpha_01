[package]
name = "switchlite-injector"
version = "0.1.0-alpha"
edition = "2021"
description = "SwitchLite Rust-led injector — C++ payload.dll stays for the in-process JNI attach"

[[bin]]
name = "switchlite-injector"
path = "src/main.rs"

[dependencies]
# windows-sys: use the "Win32" aggregate feature — pulls in every Win32_*
# module (Threading/Memory/Security/...) so no function is gated out and no
# per-feature version conflicts can occur.
windows-sys = { version = "0.59", features = ["Win32"] }

[profile.release]
opt-level = 2
