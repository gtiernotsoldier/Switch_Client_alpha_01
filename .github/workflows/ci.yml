name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── JVM build (core + agent + adapter:common + fat jar) ───
  jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with: { java-version: '8', distribution: 'temurin' }
      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.5' }
      - name: Compile
        run: cd SwitchLite && gradle :core:compileKotlin :agent:classes :adapter:common:compileKotlin --no-daemon
      - name: Build agent fat jar
        run: cd SwitchLite && gradle :agent:jar --no-daemon
      - name: Validate agent.jar
        run: |
          JAR=$(ls SwitchLite/agent/build/libs/switchlite-agent-*.jar | head -1)
          echo "Validating: $JAR"
          SIZE=$(wc -c < "$JAR")
          echo "Size: $SIZE bytes"
          if [ "$SIZE" -lt 1000000 ]; then
            echo "ERROR: agent.jar is too small ($SIZE bytes). Fat jar likely broken."
            exit 1
          fi
          if ! jar tf "$JAR" | grep -q "io/switchlite/adapter/common/api/EventBridge"; then
            echo "ERROR: EventBridge.class not found in fat jar. Class merging broken."
            exit 1
          fi
          if ! jar tf "$JAR" | grep -q "io/switchlite/core/model/PlayerState"; then
            echo "ERROR: PlayerState.class not found in fat jar. Core not included."
            exit 1
          fi
          echo "agent.jar validation passed."
      - name: Run tests
        run: cd SwitchLite && gradle :core:test :adapter:common:test --no-daemon
      - name: Compile summary
        if: always()
        run: |
          echo "## Compile Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Module | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| core | :white_check_mark: |" >> $GITHUB_STEP_SUMMARY
          echo "| agent | :white_check_mark: |" >> $GITHUB_STEP_SUMMARY
          echo "| adapter:common | :white_check_mark: |" >> $GITHUB_STEP_SUMMARY
      - name: Upload agent.jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: switchlite-agent-jar
          path: SwitchLite/agent/build/libs/switchlite-agent-*.jar

  # ─── Injector (Windows) ───
  injector:
    runs-on: windows-latest
    needs: jvm
    steps:
      - uses: actions/checkout@v4
      - name: Download agent.jar from jvm job
        uses: actions/download-artifact@v4
        with:
          name: switchlite-agent-jar
          path: _temp_agent_jar
      - name: Copy agent.jar into injector resources (overwrite 0-byte git placeholder)
        shell: pwsh
        run: |
          $src = Get-ChildItem -Path _temp_agent_jar -Recurse -Filter "*.jar" | Select-Object -First 1
          if (-not $src) { Write-Error "No jar found in downloaded artifact"; exit 1 }
          Write-Host "Found artifact jar: $($src.FullName) ($($src.Length) bytes)"
          # Overwrite the 0-byte git placeholder
          Copy-Item $src.FullName -Destination "SwitchLite\injector\resources\agent.jar" -Force
          $dest = Get-Item "SwitchLite\injector\resources\agent.jar"
          Write-Host "agent.jar ready: $($dest.Length) bytes"
          if ($dest.Length -lt 1000000) { Write-Error "agent.jar too small"; exit 1 }
          Remove-Item _temp_agent_jar -Recurse -Force
      - name: Set up JDK 8 (for jni.h in payload build)
        uses: actions/setup-java@v4
        with: { java-version: '8', distribution: 'temurin' }
      - name: Build injector (x86 for 32-bit MC javaw.exe)
        shell: cmd
        run: cd SwitchLite\injector && mkdir build && cd build && cmake .. -G "Visual Studio 17 2022" -A Win32 && cmake --build . --config Release
      - name: Show build info
        shell: pwsh
        run: |
          echo "Commit: ${{ github.sha }}"
          echo "Build time: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss UTC')"
          $exe = "SwitchLite\injector\build\Release\injector.exe"
          if (Test-Path $exe) { echo "injector.exe: $((Get-Item $exe).Length) bytes" } else { echo "WARNING: injector.exe not found" }
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: switchlite-injector
          path: SwitchLite/injector/build/Release/injector.exe
