name: Build SwitchLite Injector

on:
  push:
    branches: [main]
    paths:
      - 'injector/**'
      - 'agent/**'
      - 'core/**'
      - 'adapter/**'
      - 'mappings/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-agent-jar:
    name: Build agent.jar (Java 8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Generate Gradle Wrapper
        run: |
          cd SwitchLite
          if [ ! -f gradlew ]; then
            curl -sL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp/
            /tmp/gradle-8.5/bin/gradle wrapper --gradle-version 8.5
          fi
          chmod +x gradlew

      - name: Build agent fat JAR
        run: ./gradlew :agent:jar --no-daemon
        working-directory: SwitchLite

      - name: Copy agent.jar to injector resources
        run: |
          cp agent/build/libs/switchlite-agent-*-all.jar injector/resources/agent.jar 2>/dev/null || \
          cp agent/build/libs/switchlite-agent-*.jar injector/resources/agent.jar
          ls -la injector/resources/agent.jar
        working-directory: SwitchLite

      - name: Validate agent.jar
        run: jar tf injector/resources/agent.jar | grep -E "Agent\.class|MANIFEST" | head -5
        working-directory: SwitchLite

      - name: Upload agent.jar
        uses: actions/upload-artifact@v4
        with:
          name: agent-jar
          path: SwitchLite/injector/resources/agent.jar
          retention-days: 7

  build-injector-exe:
    name: Build injector.exe (MSVC)
    needs: build-agent-jar
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download agent.jar
        uses: actions/download-artifact@v4
        with:
          name: agent-jar
          path: SwitchLite/injector/resources/

      - name: Set up JDK 8 (for JNI headers)
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Build injector with CMake
        shell: cmd
        run: |
          cd SwitchLite\injector
          mkdir build
          cd build
          cmake .. -G "Visual Studio 17 2022" -A x86
          cmake --build . --config Release

      - name: Verify build output
        shell: pwsh
        run: |
          $exe = "SwitchLite\injector\build\Release\injector.exe"
          if (Test-Path $exe) {
            Write-Host "✅ injector.exe built: $((Get-Item $exe).Length) bytes"
          } else {
            Write-Error "❌ injector.exe NOT found"
            exit 1
          }

      - name: Upload injector.exe
        uses: actions/upload-artifact@v4
        with:
          name: injector-exe
          path: SwitchLite/injector/build/Release/injector.exe
          retention-days: 30
