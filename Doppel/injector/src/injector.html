<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doppel · Injector</title>
<style>
  :root {
    --bg: #05070B;
    --panel: rgba(13, 18, 28, 0.72);
    --line: rgba(255, 255, 255, 0.07);
    --cyan: #22D3EE;
    --violet: #A78BFA;
    --green: #34D399;
    --red: #F87171;
    --amber: #FBBF24;
    --dim: #5A6B7F;
    --text: #D5DEEA;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(1100px 620px at 12% -12%, rgba(34,211,238,0.10), transparent 62%),
      radial-gradient(900px 560px at 106% 8%, rgba(167,139,250,0.11), transparent 60%),
      var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 30px 24px 56px; }

  /* ── header ── */
  header { display: flex; align-items: center; gap: 14px; margin-bottom: 6px; }
  .mark {
    font-size: 27px; font-weight: 700; letter-spacing: 5px;
    background: linear-gradient(120deg, var(--cyan), var(--violet));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub { color: var(--dim); font-size: 12px; letter-spacing: 1.4px; text-transform: uppercase; }
  .tag {
    margin-left: auto; font: 11px 'SF Mono', ui-monospace, monospace; color: var(--dim);
    border: 1px solid var(--line); border-radius: 30px; padding: 4px 12px;
  }
  .tagline { color: var(--violet); font-style: italic; font-size: 12.5px; margin: 0 0 22px; opacity: .85; }

  /* ── layout ── */
  .grid { display: grid; grid-template-columns: minmax(0, 1.62fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }

  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 15px;
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); overflow: hidden;
  }
  .card-head {
    display: flex; align-items: center; gap: 10px;
    padding: 13px 16px; border-bottom: 1px solid var(--line);
  }
  .card-title { font-size: 13px; font-weight: 600; letter-spacing: .3px; }
  .count { font: 11px 'SF Mono', ui-monospace, monospace; color: var(--dim); }
  .spacer { margin-left: auto; }

  /* ── buttons ── */
  button {
    font: inherit; color: inherit; cursor: pointer; border-radius: 9px;
    border: 1px solid var(--line); background: rgba(255,255,255,0.05);
    padding: 6px 13px; font-size: 12.5px;
    transition: background .18s ease, border-color .18s ease, transform .12s ease, opacity .18s ease;
  }
  button:hover:not(:disabled) { background: rgba(255,255,255,0.1); border-color: rgba(34,211,238,0.35); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: .42; cursor: not-allowed; }
  button.ghost { background: transparent; }

  /* ── process rows ── */
  .rows { max-height: 430px; overflow-y: auto; }
  .row {
    display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 12px;
    align-items: center; padding: 11px 16px; cursor: pointer;
    border-bottom: 1px solid rgba(255,255,255,0.035);
    transition: background .16s ease, box-shadow .16s ease;
  }
  .row:last-child { border-bottom: none; }
  .row:hover { background: rgba(255,255,255,0.032); }
  .row.sel { background: rgba(34,211,238,0.075); box-shadow: inset 3px 0 0 var(--cyan); }
  .dot {
    width: 13px; height: 13px; border-radius: 50%; justify-self: center;
    border: 1.5px solid rgba(255,255,255,0.28); transition: .16s ease;
  }
  .row.sel .dot { border-color: var(--cyan); background: radial-gradient(circle, var(--cyan) 0 44%, transparent 47%); box-shadow: 0 0 12px rgba(34,211,238,0.5); }
  .pname { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .pid {
    font: 12px 'SF Mono', ui-monospace, monospace; color: var(--cyan); font-weight: 600;
    flex: 0 0 auto;
  }
  .exe { font-size: 12.5px; flex: 0 0 auto; color: rgba(255,255,255,0.85); }
  .hint {
    font: 11px 'SF Mono', ui-monospace, monospace; color: var(--dim);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 0 1 auto;
  }
  .meta { color: var(--dim); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
  .badges { display: flex; gap: 6px; flex: 0 0 auto; align-items: center; }
  .badge { font: 9.5px 'SF Mono', ui-monospace, monospace; padding: 2px 8px; border-radius: 20px; white-space: nowrap; }
  .badge.mc { color: #7dd3fc; background: rgba(56,189,248,0.12); border: 1px solid rgba(56,189,248,0.22); }
  .badge.inj { color: #6ee7b7; background: rgba(110,231,183,0.1); border: 1px solid rgba(110,231,183,0.22); }
  .badge.plain { color: var(--dim); background: rgba(255,255,255,0.04); border: 1px solid var(--line); }

  .empty { padding: 30px 20px; text-align: center; color: var(--dim); font-size: 12.5px; }
  .empty strong { color: rgba(255,255,255,0.6); font-weight: 500; }

  /* ── action bar ── */
  .action { padding: 14px 16px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 12px; }
  .action .who { font-size: 12px; color: var(--dim); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .go {
    margin-left: auto; flex: 0 0 auto; border: none; color: #04121A; font-weight: 650;
    background: linear-gradient(120deg, var(--cyan), var(--violet));
    padding: 9px 22px; box-shadow: 0 6px 24px rgba(34,211,238,0.24);
  }
  .go:hover:not(:disabled) { background: linear-gradient(120deg, #46dcf2, #b8a3fb); border-color: transparent; }

  /* ── pipeline ── */
  .steps { padding: 8px 16px 14px; }
  .step { display: grid; grid-template-columns: 22px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 8px 0; }
  .icon { width: 17px; height: 17px; border-radius: 50%; justify-self: center; border: 1.5px solid rgba(255,255,255,0.16); }
  .step.active .icon { border-color: var(--cyan); border-top-color: transparent; animation: spin .8s linear infinite; }
  .step.ok .icon { border-color: var(--green); background: var(--green); box-shadow: 0 0 14px rgba(52,211,153,0.45); }
  .step.failed .icon { border-color: var(--red); background: var(--red); box-shadow: 0 0 14px rgba(248,113,113,0.45); }
  @keyframes spin { to { transform: rotate(360deg); } }
  .slabel { min-width: 0; }
  .stext { font-size: 12.8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .step.pending .stext { color: var(--dim); }
  .snote { font: 11px 'SF Mono', ui-monospace, monospace; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .secs { font: 11px 'SF Mono', ui-monospace, monospace; color: var(--dim); flex: 0 0 auto; }

  /* ── result ── */
  .result { margin: 0 16px 16px; border-radius: 13px; padding: 13px 15px; display: none; }
  .result.show { display: block; animation: pop .3s cubic-bezier(.22,1,.36,1); }
  .result.ok { background: rgba(52,211,153,0.07); border: 1px solid rgba(52,211,153,0.22); }
  .result.failed { background: rgba(248,113,113,0.07); border: 1px solid rgba(248,113,113,0.22); }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } }
  .rhead { font-size: 12.5px; font-weight: 600; margin-bottom: 9px; }
  .result.ok .rhead { color: var(--green); }
  .result.failed .rhead { color: var(--red); }
  .kv { display: flex; align-items: center; gap: 9px; padding: 4px 0; font-size: 12px; min-width: 0; }
  .kv .k { color: var(--dim); width: 62px; flex: 0 0 auto; font: 10.5px 'SF Mono', ui-monospace, monospace; letter-spacing: .6px; }
  .kv .v {
    font: 12px 'SF Mono', ui-monospace, monospace; color: var(--cyan);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0;
  }
  .kv .v.tok { color: var(--amber); }
  .mini { font-size: 11px; padding: 3px 9px; flex: 0 0 auto; }

  /* ── log ── */
  .log { max-height: 190px; overflow-y: auto; padding: 10px 16px 14px; border-top: 1px solid var(--line); }
  .line { font: 11.5px 'SF Mono', ui-monospace, monospace; padding: 2px 0; color: var(--dim); display: flex; gap: 8px; }
  .line .b { flex: 0 0 auto; opacity: .8; }
  .line.warn { color: var(--amber); }
  .line.error { color: var(--red); }
  .line.ok { color: var(--green); }
  .line span.t { min-width: 0; overflow-wrap: anywhere; }

  /* ── footer ── */
  footer { margin-top: 18px; display: flex; align-items: center; gap: 12px; color: var(--dim); font-size: 11.5px; }
  .note { opacity: .75; }

  /* scrollbars */
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.18); }
  ::-webkit-scrollbar-track { background: transparent; }

  .enter { animation: fade .35s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(5px); } }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="mark">DOPPEL</div>
    <div class="sub">injector</div>
    <div class="tag" id="verTag">local panel</div>
  </header>
  <p class="tagline">statistically you.</p>

  <div class="grid">

    <!-- ── left: process picker ── -->
    <div class="card enter">
      <div class="card-head">
        <span class="card-title">Java processes</span>
        <span class="count" id="procCount">—</span>
        <span class="spacer"></span>
        <button class="ghost" id="refreshBtn">Refresh</button>
      </div>

      <div class="rows" id="rows">
        <div class="empty">Scanning…</div>
      </div>

      <div class="action">
        <span class="who" id="who">No process selected</span>
        <button class="go" id="injectBtn" disabled>Inject</button>
      </div>
    </div>

    <!-- ── right: pipeline ── -->
    <div class="card enter">
      <div class="card-head">
        <span class="card-title" id="stateTitle">Ready</span>
        <span class="count" id="pidTag"></span>
      </div>

      <div class="steps" id="steps"></div>

      <div class="result" id="result">
        <div class="rhead" id="resultHead"></div>
        <div id="resultBody"></div>
      </div>

      <div class="log" id="log"></div>
    </div>

  </div>

  <footer>
    <button class="ghost mini" id="quitBtn">Close injector</button>
    <span class="note" id="footNote">Listens on 127.0.0.1 only · every request carries this session's token</span>
  </footer>

</div>

<script>
(function () {
  'use strict';

  var T = new URLSearchParams(location.search).get('t') || '';
  var selectedPid = 0;
  var lastSig = '';
  var busyNow = false;
  var polling = { procs: null, state: null };

  // ── api ──
  function api(path, opts) {
    var o = opts || {};
    o.headers = Object.assign({ 'X-Doppel-Token': T }, o.headers || {});
    return fetch(path, o).then(function (r) {
      if (!r.ok) { throw new Error('HTTP ' + r.status); }
      return r.status === 204 ? null : r.json();
    });
  }

  function el(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // ── process list ──
  function renderProcesses(data) {
    var list = (data && data.processes) || [];
    el('procCount').textContent = list.length ? list.length + ' found' : 'none';

    // Keep the user's pick if it still exists; otherwise prefer a Minecraft
    // process, so the common case is one click away.
    var stillThere = list.some(function (p) { return p.pid === selectedPid; });
    if (!stillThere) {
      selectedPid = 0;
      for (var i = 0; i < list.length; i++) {
        if (list[i].minecraft && !list[i].injected) { selectedPid = list[i].pid; break; }
      }
      if (!selectedPid) {
        for (var j = 0; j < list.length; j++) {
          if (list[j].minecraft) { selectedPid = list[j].pid; break; }
        }
      }
    }
    syncSelection();

    // Rebuild only when something visible changed — avoids fighting scroll.
    var sig = list.map(function (p) {
      return p.pid + ':' + p.injected + ':' + p.minecraft + ':' + p.title + ':' + p.hint;
    }).join('|') + '#' + selectedPid;
    if (sig === lastSig) { return; }
    lastSig = sig;

    if (!list.length) {
      el('rows').innerHTML =
        '<div class="empty"><strong>No Java process found.</strong><br>' +
        'Launch Minecraft — this list refreshes by itself.</div>';
      return;
    }

    var html = '';
    for (var k = 0; k < list.length; k++) {
      var p = list[k];
      var title = p.title || p.hint || p.path || '';
      html += '<div class="row' + (p.pid === selectedPid ? ' sel' : '') +
        '" data-pid="' + p.pid + '" data-injected="' + (p.injected ? '1' : '0') + '">' +
        '<div class="dot"></div>' +
        '<div style="min-width:0">' +
          '<div class="pname">' +
            '<span class="pid">' + p.pid + '</span>' +
            '<span class="exe">' + esc(p.exe) + '</span>' +
            (p.minecraft ? '' : '<span class="hint">' + esc(p.hint || '') + '</span>') +
          '</div>' +
          '<div class="meta">' + esc(title) + '</div>' +
        '</div>' +
        '<div class="badges">' +
          (p.injected ? '<span class="badge inj">INJECTED</span>' : '') +
          (p.minecraft ? '<span class="badge mc">MINECRAFT</span>'
                       : '<span class="badge plain">JAVA</span>') +
        '</div>' +
      '</div>';
    }
    el('rows').innerHTML = html;
  }

  function syncSelection() {
    var btn = el('injectBtn');
    var who = el('who');
    if (busyNow) {
      btn.disabled = true;
      btn.textContent = 'Working…';
      return;
    }
    btn.textContent = 'Inject';
    if (!selectedPid) {
      btn.disabled = true;
      who.textContent = 'No process selected';
      return;
    }
    var row = document.querySelector('.row[data-pid="' + selectedPid + '"]');
    // The agent cannot be unloaded from a running JVM, so a second injection
    // into the same process would silently do nothing. Block it here.
    if (row && row.dataset.injected === '1') {
      btn.disabled = true;
      who.textContent = 'PID ' + selectedPid + ' already has Doppel — restart Minecraft first';
      return;
    }
    btn.disabled = false;
    who.textContent = 'Selected PID ' + selectedPid;
  }

  el('rows').addEventListener('click', function (e) {
    var row = e.target.closest('.row');
    if (!row) { return; }
    selectedPid = parseInt(row.dataset.pid, 10) || 0;
    var all = document.querySelectorAll('.row');
    for (var i = 0; i < all.length; i++) { all[i].classList.toggle('sel', all[i] === row); }
    syncSelection();
  });

  // ── pipeline ──
  var STATE_TITLE = { idle: 'Ready', injecting: 'Injecting', done: 'Done', failed: 'Failed' };

  function renderState(s) {
    el('stateTitle').textContent = STATE_TITLE[s.phase] || 'Ready';
    el('pidTag').textContent = s.pid ? 'PID ' + s.pid : '';

    var html = '';
    for (var i = 0; i < s.steps.length; i++) {
      var st = s.steps[i];
      html += '<div class="step ' + st.state + '">' +
        '<div class="icon"></div>' +
        '<div class="slabel">' +
          '<div class="stext">' + esc(st.label) + '</div>' +
          (st.note ? '<div class="snote">' + esc(st.note) + '</div>' : '') +
        '</div>' +
        '<div class="secs">' + (st.secs > 0 ? st.secs.toFixed(1) + 's' : '') + '</div>' +
      '</div>';
    }
    el('steps').innerHTML = html;

    // result box
    var box = el('result');
    if (s.phase === 'done') {
      box.className = 'result ok show';
      el('resultHead').textContent = s.headline;
      var body = '<div class="kv"><span class="k">PID</span><span class="v">' + s.pid + '</span></div>';
      if (s.version) {
        body += '<div class="kv"><span class="k">VERSION</span><span class="v">' +
          esc(s.version) + (s.platform ? ' · ' + esc(s.platform) : '') + '</span></div>';
      }
      if (s.panel) {
        body += '<div class="kv"><span class="k">PANEL</span><span class="v">' + esc(s.panel) + '</span>' +
          '<button class="ghost mini" data-open="' + esc(s.panel) + '">Open</button></div>';
      } else {
        body += '<div class="kv"><span class="k">PANEL</span><span class="v">' +
          'still starting — see %TEMP%\\doppel-payload.log</span></div>';
      }
      if (s.panelToken) {
        body += '<div class="kv"><span class="k">TOKEN</span><span class="v tok">' + esc(s.panelToken) + '</span>' +
          '<button class="ghost mini" data-copy="' + esc(s.panelToken) + '">Copy</button></div>';
      }
      el('resultBody').innerHTML = body;
    } else if (s.phase === 'failed') {
      box.className = 'result failed show';
      el('resultHead').textContent = s.headline;
      el('resultBody').innerHTML =
        '<div class="kv"><span class="k">LOG</span><span class="v">%TEMP%\\doppel-payload.log</span></div>';
    } else {
      box.className = 'result';
      el('resultBody').innerHTML = '';
    }

    // log
    var log = el('log');
    var lines = '';
    for (var e = 0; e < s.events.length; e++) {
      var ev = s.events[e];
      var bullet = ev.kind === 'ok' ? '✓' : ev.kind === 'warn' ? '!' : ev.kind === 'error' ? '✗' : '·';
      lines += '<div class="line ' + ev.kind + '"><span class="b">' + bullet +
        '</span><span class="t">' + esc(ev.text) + '</span></div>';
    }
    log.innerHTML = lines;
    log.scrollTop = log.scrollHeight;

    var busy = s.phase === 'injecting';
    busyNow = busy;
    syncSelection();
    el('refreshBtn').disabled = busy;
    el('verTag').textContent = busy ? 'injecting…' : 'local panel';
  }

  document.addEventListener('click', function (e) {
    var open = e.target.getAttribute && e.target.getAttribute('data-open');
    if (open) { window.open(open, '_blank'); return; }
    var copy = e.target.getAttribute && e.target.getAttribute('data-copy');
    if (copy) {
      if (navigator.clipboard) { navigator.clipboard.writeText(copy); }
      e.target.textContent = 'Copied';
      setTimeout(function () { e.target.textContent = 'Copy'; }, 1200);
    }
  });

  // ── loops (self-scheduling, never overlapping) ──
  var phase = 'idle';

  function pollProcesses() {
    clearTimeout(polling.procs);
    var delay = phase === 'injecting' ? 6000 : 2500;
    api('/api/processes').then(function (d) {
      renderProcesses(d);
      syncSelection();
    }).catch(function () { /* panel closed or restarting */ })
      .then(function () { polling.procs = setTimeout(pollProcesses, delay); });
  }

  function pollState() {
    clearTimeout(polling.state);
    api('/api/state').then(function (s) {
      var was = phase;
      phase = s.phase;
      renderState(s);
      // A finished injection changes the badge on the row — refresh the list.
      if (was !== s.phase && (s.phase === 'done' || s.phase === 'failed')) {
        clearTimeout(polling.procs);
        pollProcesses();
      }
    }).catch(function () { /* ignore */ })
      .then(function () { polling.state = setTimeout(pollState, 500); });
  }

  el('refreshBtn').addEventListener('click', function () {
    lastSig = '';
    clearTimeout(polling.procs);
    pollProcesses();
  });

  el('injectBtn').addEventListener('click', function () {
    if (!selectedPid) { return; }
    var pid = selectedPid;
    el('injectBtn').disabled = true;
    el('injectBtn').textContent = 'Working…';
    api('/api/inject', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pid: pid })
    }).catch(function (err) {
      el('result').className = 'result failed show';
      el('resultHead').textContent = 'Could not start the injection';
      el('resultBody').innerHTML =
        '<div class="kv"><span class="k">REASON</span><span class="v">' + esc(err.message) + '</span></div>';
      lastSig = '';          // force a fresh process scan
      syncSelection();       // restores the right button state for the row
      clearTimeout(polling.procs);
      pollProcesses();
    });
  });

  el('quitBtn').addEventListener('click', function () {
    el('quitBtn').disabled = true;
    el('quitBtn').textContent = 'Closing…';
    api('/api/quit', { method: 'POST' }).catch(function () {});
  });

  // ── go ──
  if (!T) {
    el('rows').innerHTML = '<div class="empty"><strong>Missing token.</strong><br>' +
      'Re-open the URL printed in the injector console.</div>';
    return;
  }
  pollProcesses();
  pollState();
})();
</script>
</body>
</html>
