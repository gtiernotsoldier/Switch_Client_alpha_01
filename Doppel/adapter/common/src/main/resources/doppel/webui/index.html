<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doppel · Aurora Console</title>
    <style>
        /* ===== Global Reset & Aurora Base ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            user-select: none;
        }
        body {
            background: #05070B;
            min-height: 100vh;
            display: flex;
            overflow: hidden;
            color: #D5DEEA;
        }
        /* Drifting aurora glow — pure background layer, zero layout impact */
        body::before {
            content: ''; position: fixed; top: -22%; left: -22%; right: -22%; bottom: -22%;
            z-index: -1; pointer-events: none;
            background-image: radial-gradient(circle at 24% 28%, rgba(34, 211, 238, 0.09) 0%, transparent 44%),
                              radial-gradient(circle at 78% 74%, rgba(167, 139, 250, 0.09) 0%, transparent 46%);
            animation: auroraDrift 24s ease-in-out infinite alternate;
        }
        @keyframes auroraDrift {
            0%   { transform: translate3d(-1.5%, -1%, 0) scale(1); }
            50%  { transform: translate3d(1.5%, 1.5%, 0) scale(1.06); }
            100% { transform: translate3d(-1%, 1.2%, 0) scale(1.02); }
        }

        /* =========================================================
           Left rail — reference-style narrow navigation
           ========================================================= */
        .rail {
            width: 184px; flex-shrink: 0; height: 100vh;
            background: rgba(7, 10, 16, 0.86);
            backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            display: flex; flex-direction: column;
            padding: 18px 0 16px 0;
            position: relative; z-index: 10;
            box-shadow: 4px 0 44px rgba(0,0,0,0.45);
        }
        .rail-brand {
            display: flex; align-items: center; gap: 10px;
            padding: 2px 18px 16px 18px;
        }
        .rail-mark {
            width: 30px; height: 30px; border-radius: 9px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; font-weight: 800; color: #fff;
            background: linear-gradient(135deg, rgba(34,211,238,0.22), rgba(167,139,250,0.22));
            border: 1px solid rgba(34,211,238,0.35);
            box-shadow: 0 0 22px rgba(34,211,238,0.12);
        }
        .rail-name { display: flex; flex-direction: column; min-width: 0; }
        .rail-name b {
            font-size: 14.5px; font-weight: 650; letter-spacing: 0.02em;
            background: linear-gradient(120deg, #22D3EE, #A78BFA, #22D3EE);
            background-size: 220% 220%;
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: brandFlow 7s ease-in-out infinite;
            white-space: nowrap;
        }
        @keyframes brandFlow { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
        .rail-name span {
            font-size: 8.5px; color: rgba(255,255,255,0.28); letter-spacing: 0.14em;
            text-transform: uppercase; font-family: 'SF Mono', monospace;
        }
        .rail-group {
            font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase;
            color: rgba(255,255,255,0.22); font-family: 'SF Mono', monospace;
            padding: 14px 20px 6px 20px;
        }
        .nav-menu { overflow-y: auto; padding: 0 10px; }
        .nav-item {
            display: flex; align-items: center; gap: 10px;
            padding: 8px 10px; margin: 1px 0; border-radius: 9px;
            font-size: 13px; color: rgba(255,255,255,0.5); cursor: pointer;
            transition: background 0.3s ease, color 0.3s ease; position: relative;
        }
        .nav-item::before {
            content: ''; position: absolute; left: -10px; top: 26%; bottom: 26%; width: 2px; border-radius: 2px;
            background: linear-gradient(180deg, #22D3EE, #A78BFA);
            opacity: 0; transform: scaleY(0.3);
            transition: opacity 0.35s ease, transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .nav-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
        .nav-item.active {
            background: linear-gradient(135deg, rgba(34, 211, 238, 0.15), rgba(167, 139, 250, 0.13));
            color: #fff; border: 1px solid rgba(34, 211, 238, 0.18);
        }
        .nav-item.active::before { opacity: 1; transform: scaleY(1); }
        .nav-item .n-icon {
            width: 20px; height: 20px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            opacity: 0.65;
        }
        .nav-item.active .n-icon { opacity: 1; }
        .nav-item .n-icon svg { width: 15px; height: 15px; }
        .nav-item .badge {
            font-size: 8px; background: rgba(34, 211, 238, 0.16); padding: 1px 7px; border-radius: 40px;
            margin-left: auto; color: rgba(255,255,255,0.55); border: 1px solid rgba(34, 211, 238, 0.18);
            font-family: 'SF Mono', monospace; letter-spacing: 0.1em;
        }
        .rail-foot { margin-top: auto; padding: 0 12px; }
        .side-conn {
            padding: 10px 12px; border-radius: 11px;
            background: rgba(13,18,28,0.66); border: 1px solid rgba(255,255,255,0.06);
            font-size: 11px; color: rgba(255,255,255,0.55);
        }
        .side-conn .dot { color:#34D399; }
        .side-conn .sub { display:block; font-size:8.5px; color:rgba(255,255,255,0.25); margin-top:3px; letter-spacing:0.1em; text-transform:uppercase; }
        .rail-slogan {
            text-align: center; font-size: 9px; color: rgba(255,255,255,0.16);
            padding: 12px 0 0 0; letter-spacing: 0.08em;
        }

        /* =========================================================
           Stage — everything below lives in a CENTERED column
           ========================================================= */
        .stage {
            flex: 1; height: 100vh; overflow-y: auto;
            display: flex; flex-direction: column; align-items: center;
        }
        .col { width: min(820px, 100%); padding: 26px 24px 110px 24px; }

        /* ---- Profile bar (config name + eye + status) ---- */
        .profile-bar {
            display: flex; align-items: center; gap: 12px;
            background: rgba(13, 18, 28, 0.72);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 14px; padding: 13px 16px;
            box-shadow: 0 12px 44px rgba(0,0,0,0.35);
        }
        .profile-name { font-size: 15px; font-weight: 600; color: rgba(255,255,255,0.95); }
        .profile-sub { font-size: 10px; color: rgba(255,255,255,0.3); font-family: 'SF Mono', monospace; letter-spacing: 0.08em; margin-top: 1px; }
        .profile-main { min-width: 0; }
        .profile-bar .spacer { flex: 1; }
        .header-status {
            color: #34D399; font-size: 12px; background: rgba(52, 211, 153, 0.08);
            padding: 4px 13px; border-radius: 40px; border: 1px solid rgba(52, 211, 153, 0.16);
            animation: statusPulse 2.8s ease-in-out infinite; white-space: nowrap;
        }
        @keyframes statusPulse {
            0%, 100% { box-shadow: 0 0 0 rgba(52, 211, 153, 0); }
            50% { box-shadow: 0 0 18px rgba(52, 211, 153, 0.2); }
        }
        /* Eye — toggles the in-game HUD module */
        .eye-chip {
            width: 30px; height: 30px; border-radius: 9px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            color: rgba(52,211,153,0.9); background: rgba(52,211,153,0.08);
            border: 1px solid rgba(52,211,153,0.2); cursor: pointer; transition: 0.25s;
        }
        .eye-chip svg { width: 15px; height: 15px; }
        .eye-chip:hover { background: rgba(52,211,153,0.16); }
        .eye-chip.off { color: rgba(255,255,255,0.3); background: rgba(255,255,255,0.04); border-color: rgba(255,255,255,0.08); }

        /* ---- Meta row (connection urls) ---- */
        .meta-row { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 2px 0 2px; }
        .meta-row .bd {
            font-size: 9.5px; color: rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
            padding: 2px 10px; border-radius: 40px; font-family: 'SF Mono', monospace;
        }

        /* ---- Panic bar ---- */
        .panic-bar {
            margin-top: 10px; display: flex; align-items: center; gap: 10px;
            background: rgba(13, 18, 28, 0.5);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 12px; padding: 9px 16px;
            color: rgba(255,255,255,0.35); font-size: 12px; cursor: pointer;
            transition: border-color 0.3s ease, background 0.3s ease, color 0.3s ease;
        }
        .panic-bar:hover { border-color: rgba(248, 113, 113, 0.35); color: rgba(255,255,255,0.6); }
        .panic-bar.arm { border-color: rgba(248, 113, 113, 0.6); color: #FCA5A5; background: rgba(248,113,113,0.06); }
        .panic-bar .p-label { font-family: 'SF Mono', monospace; font-size: 11px; letter-spacing: 0.1em; }
        .panic-bar .p-sub { font-size: 11px; color: rgba(255,255,255,0.22); }
        .panic-bar kbd {
            margin-left: auto; font-family: 'SF Mono', monospace; font-size: 10px;
            color: rgba(255,255,255,0.4); background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.09); border-bottom-width: 2px;
            border-radius: 6px; padding: 2px 8px;
        }

        /* ---- Category row: bordered tabs + square icon buttons ---- */
        .cat-row { display: flex; align-items: center; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
        .tab {
            padding: 9px 26px; color: rgba(255,255,255,0.45); font-size: 13.5px; cursor: pointer;
            background: rgba(13, 18, 28, 0.55);
            border: 1px solid rgba(255,255,255,0.07); border-radius: 11px;
            transition: color 0.3s ease, border-color 0.35s ease, box-shadow 0.35s ease, background 0.3s ease;
            font-weight: 500;
        }
        .tab:hover { color: #fff; border-color: rgba(255,255,255,0.16); }
        .tab.active {
            color: #fff; border-color: rgba(34, 211, 238, 0.45);
            background: linear-gradient(135deg, rgba(34, 211, 238, 0.13), rgba(167, 139, 250, 0.11));
            box-shadow: 0 0 26px rgba(34, 211, 238, 0.12), inset 0 0 18px rgba(34, 211, 238, 0.05);
            animation: tabIn 0.4s cubic-bezier(0.22, 1, 0.36, 1);
        }
        @keyframes tabIn { from { opacity: 0.5; transform: translateY(2px); } to { opacity: 1; transform: none; } }
        .cat-row .spacer { flex: 1; }
        .icon-btn {
            width: 37px; height: 37px; border-radius: 11px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            background: rgba(13, 18, 28, 0.55);
            border: 1px solid rgba(255,255,255,0.07);
            color: rgba(255,255,255,0.45); cursor: pointer; transition: 0.25s;
        }
        .icon-btn svg { width: 16px; height: 16px; }
        .icon-btn:hover { color: #fff; border-color: rgba(34,211,238,0.4); box-shadow: 0 0 20px rgba(34,211,238,0.12); }

        /* =========================================================
           Module grid — two columns of cards
           ========================================================= */
        .module-grid { display: flex; gap: 14px; align-items: flex-start; margin-top: 14px; }
        .module-column { flex: 1; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
        .setting-grid { display: flex; flex-direction: column; gap: 10px; width: 100%; }

        .setting-item {
            position: relative;
            background: rgba(13, 18, 28, 0.66); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
            border-radius: 13px; border: 1px solid rgba(255,255,255,0.07); overflow: hidden;
            transition: border-color 0.45s cubic-bezier(0.22, 1, 0.36, 1),
                        background 0.35s ease,
                        box-shadow 0.45s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .setting-item:hover { background: rgba(16, 22, 34, 0.78); border-color: rgba(34, 211, 238, 0.22); }
        .setting-item.expanded {
            border-color: rgba(34, 211, 238, 0.35);
            background: rgba(11, 16, 26, 0.85);
            box-shadow: 0 10px 44px rgba(0, 0, 0, 0.45), 0 0 36px rgba(34, 211, 238, 0.09);
        }
        .setting-item::after {
            content: ''; position: absolute; top: 0; left: 12%; right: 12%; height: 1px; pointer-events: none;
            background: linear-gradient(90deg, transparent, rgba(34, 211, 238, 0.55), rgba(167, 139, 250, 0.55), transparent);
            opacity: 0; transition: opacity 0.5s ease;
        }
        .setting-item.expanded::after { opacity: 1; }

        .setting-header {
            display: flex; align-items: center; gap: 11px;
            padding: 11px 14px 7px 14px; cursor: pointer;
        }
        .setting-header:hover { background: rgba(255,255,255,0.03); }
        .setting-label { display: flex; align-items: center; gap: 11px; font-size: 14px; color: rgba(255,255,255,0.92); font-weight: 500; pointer-events: none; min-width: 0; }
        .setting-label .m-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        /* Unique per-module SVG icon tile */
        .mod-icon {
            width: 31px; height: 31px; border-radius: 9px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid; pointer-events: none;
            transition: box-shadow 0.4s ease, background 0.3s ease;
        }
        .mod-icon svg { width: 16px; height: 16px; }
        .setting-item:hover .mod-icon { box-shadow: 0 0 18px rgba(34,211,238,0.15); }
        .mod-icon.cat-COMBAT   { color:#FBBF24; background:rgba(251,191,36,0.08);  border-color:rgba(251,191,36,0.22); }
        .mod-icon.cat-PLAYER   { color:#F472B6; background:rgba(244,114,182,0.08); border-color:rgba(244,114,182,0.22); }
        .mod-icon.cat-MOVEMENT { color:#6EE7B7; background:rgba(110,231,183,0.08); border-color:rgba(110,231,183,0.22); }
        .mod-icon.cat-WORLD    { color:#A3E635; background:rgba(163,230,53,0.08);  border-color:rgba(163,230,53,0.22); }
        .mod-icon.cat-RENDER   { color:#22D3EE; background:rgba(34,211,238,0.08);  border-color:rgba(34,211,238,0.22); }
        .mod-icon.cat-MISC     { color:#A78BFA; background:rgba(167,139,250,0.08); border-color:rgba(167,139,250,0.22); }
        /* Mode chip at a glance (e.g. Legit / Pack / Switch) */
        .mode-chip {
            font-size: 9px; color: rgba(103, 232, 249, 0.75); background: rgba(34, 211, 238, 0.07);
            padding: 1.5px 8px; border-radius: 30px; border: 1px solid rgba(34, 211, 238, 0.13);
            font-family: 'SF Mono', monospace; pointer-events: none; flex-shrink: 0;
        }
        .setting-right { margin-left: auto; display: flex; align-items: center; gap: 10px; pointer-events: auto; flex-shrink: 0; }

        /* Bottom-center drawer handle (reference-style chevron) */
        .drawer-handle {
            width: 100%; text-align: center; color: rgba(255,255,255,0.2); font-size: 12px;
            line-height: 1; padding: 1px 0 8px 0; cursor: pointer;
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), color 0.3s ease;
        }
        .setting-item:hover .drawer-handle { color: rgba(34,211,238,0.55); }
        .setting-item.expanded .drawer-handle { transform: rotate(180deg); color: rgba(34,211,238,0.7); }

        /* ===== Pill Toggle ===== */
        .toggle-switch {
            width: 36px; height: 19px; background: rgba(255,255,255,0.08); border-radius: 40px;
            position: relative; cursor: pointer; transition: background 0.3s, box-shadow 0.3s; flex-shrink: 0;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }
        .toggle-switch::after {
            content: ''; position: absolute; top: 2px; left: 2px; width: 15px; height: 15px; background: #fff;
            border-radius: 50%; transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.3s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        .toggle-switch.on { background: linear-gradient(135deg, #22D3EE, #A78BFA); box-shadow: 0 0 24px rgba(34, 211, 238, 0.3); }
        .toggle-switch.on::after { transform: translateX(17px); }
        .toggle-switch .pulse-ring { position: absolute; top: -4px; left: -4px; right: -4px; bottom: -4px; border-radius: 40px; border: 1px solid transparent; pointer-events: none; transition: border-color 0.3s; }
        .toggle-switch.on .pulse-ring { border-color: rgba(34, 211, 238, 0.3); animation: pulse-glow 2.5s infinite ease-in-out; }
        @keyframes pulse-glow { 0% { opacity: 0.4; transform: scale(1); } 50% { opacity: 1; transform: scale(1.12); } 100% { opacity: 0.4; transform: scale(1); } }

        /* ===== Expanded drawer — the "push the table" effect ===== */
        .sub-options {
            max-height: 0;
            opacity: 0;
            visibility: hidden;
            transition: max-height 0.55s cubic-bezier(0.33, 1, 0.68, 1),
                        opacity 0.45s ease 0.04s,
                        padding 0.45s ease,
                        border-color 0.3s ease,
                        visibility 0s linear 0.55s;
            padding: 0 14px;
            border-top: 1px solid transparent;
            overflow: hidden;
        }
        .setting-item.expanded .sub-options {
            max-height: 2600px;
            opacity: 1;
            visibility: visible;
            padding: 12px 14px 14px 14px;
            border-top: 1px solid rgba(34, 211, 238, 0.10);
            transition: max-height 0.55s cubic-bezier(0.33, 1, 0.68, 1),
                        opacity 0.45s ease 0.04s,
                        padding 0.45s ease,
                        border-color 0.3s ease,
                        visibility 0s;
        }
        .sub-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px 16px; }
        .sub-row {
            display: flex; justify-content: space-between; align-items: center; gap: 10px;
            font-size: 13px; color: rgba(255,255,255,0.85); padding: 3px 0;
        }
        .sub-label { display: flex; align-items: center; gap: 6px; white-space: nowrap; min-width: 0; }
        .sub-label .opt-name { overflow: hidden; text-overflow: ellipsis; }
        .sub-actions { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; margin-top: 2px; }
        .mini-btn { font-size: 10px; padding: 3px 10px; border-radius: 30px; border: 1px solid rgba(34,211,238,0.15); color: rgba(34,211,238,0.7); background: rgba(34,211,238,0.06); cursor: pointer; }
        .mini-btn:hover { background: rgba(34,211,238,0.12); }
        .noopts { font-size: 11px; color: rgba(255,255,255,0.2); font-style: italic; }

        .ver-tag { font-size: 9px; padding: 1px 6px; border-radius: 20px; font-family:'SF Mono',monospace; flex-shrink: 0; }
        .ver-tag.v19 { color:#7dd3fc; background:rgba(56,189,248,0.12); border:1px solid rgba(56,189,248,0.2); }
        .ver-tag.v18 { color:#fca5a5; background:rgba(248,113,113,0.12); border:1px solid rgba(248,113,113,0.2); }

        .sub-select {
            background: rgba(255,255,255,0.09); color: #fff; border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px; padding: 4px 8px; font-size: 12.5px; cursor: pointer;
            min-width: 0; max-width: 170px; flex: 0 1 auto; text-overflow: ellipsis; transition: 0.2s;
        }
        .sub-select:hover { border-color: rgba(34,211,238,0.45); }
        .sub-select:focus { outline: none; border-color: rgba(34,211,238,0.55); box-shadow: 0 0 0 3px rgba(34,211,238,0.08); }
        .sub-select option { background: #12151d; color:#fff; }
        .num-input {
            width: 64px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 6px; color: #fff; padding: 3px 6px; font-size: 12px; text-align: center; transition: 0.2s;
        }
        .num-input:focus { outline: none; border-color: rgba(34, 211, 238, 0.5); box-shadow: 0 0 0 3px rgba(34,211,238,0.07); }
        .text-input { flex: 1; min-width: 90px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); border-radius: 6px; color: #fff; padding: 3px 8px; font-size: 12px; }
        /* Slider */
        .slider-row { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 4px; margin: 2px 0; }
        .slider-label-row { display: flex; justify-content: space-between; font-size: 13px; color: rgba(255,255,255,0.6); gap: 8px; }
        .slider-label-row .slider-value { color: rgba(34, 211, 238, 0.85); font-weight: 500; white-space: nowrap; }
        .slider-track { width: 100%; height: 6px; background: rgba(255,255,255,0.08); border-radius: 6px; position: relative; cursor: pointer; }
        .slider-fill { height: 100%; border-radius: 6px; background: linear-gradient(90deg, #22D3EE, #A78BFA); transition: width 0.25s cubic-bezier(0.22, 1, 0.36, 1); box-shadow: 0 0 14px rgba(34, 211, 238, 0.3); }
        .empty { font-size: 12px; color: rgba(255,255,255,0.25); padding: 16px; text-align: center; animation: colIn 0.4s ease backwards; }

        /* Keybind + HUD rows inside the drawer */
        .kb-chip {
            font-size: 10px; color: rgba(34,211,238,0.85); background: rgba(34,211,238,0.08);
            padding: 2px 10px; border-radius: 30px; border: 1px solid rgba(34,211,238,0.15);
            cursor: pointer; white-space: nowrap; transition: 0.2s; font-family:'SF Mono',monospace;
        }
        .kb-chip:hover { background: rgba(34,211,238,0.18); }
        .kb-chip.capturing { background: rgba(167,139,250,0.18); border-color: rgba(167,139,250,0.4); color:#fff; animation: pulse-glow 1s infinite; }
        .hud-chip {
            font-size: 12px; color: rgba(52,211,153,0.9); background: rgba(52,211,153,0.08);
            width: 24px; height: 24px; display:flex; align-items:center; justify-content:center;
            border-radius: 30px; border: 1px solid rgba(52,211,153,0.2); cursor: pointer; transition: 0.2s;
        }
        .hud-chip.off { color: rgba(255,255,255,0.3); background: rgba(255,255,255,0.04); border-color: rgba(255,255,255,0.08); }
        .hud-chip:hover { background: rgba(52,211,153,0.18); }

        /* ===== Toast ===== */
        #toast {
            position: fixed; top: 26px; left: 50%; transform: translateX(-50%) translateY(-8px);
            background: rgba(13,18,28,0.9); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(34,211,238,0.25); border-radius: 40px; padding: 9px 22px;

            'NoHurtCam':        '<path d="M3 9a2 2 0 012-2h2.2l1.4-2h6.8l1.4 2H19a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><circle cx="12" cy="13" r="3"/><path d="M4 4l17 17"/>',
            'Fullbright':       '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.8M12 18.7v2.8M2.5 12h2.8M18.7 12h2.8M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',
            'JumpTiming':       '<path d="M8.5 20.5v-11"/><path d="M4.8 13.2L8.5 9.5l3.7 3.7"/><circle cx="16.5" cy="15.5" r="4.5"/><path d="M16.5 13.4v2.2l1.5 1"/>',
            'Speedometer':      '<path d="M4.5 16.5a7.8 7.8 0 1115 0"/><path d="M12 16.5l4-5.6"/><circle cx="12" cy="16.5" r="1.3"/><path d="M3.5 20h17"/>',
            'KnockbackDisplay': '<path d="M20 7L9.5 17.5"/><path d="M9.5 13.5v4h4"/><path d="M20 12V7h-5"/>',
            'JumpStatus':       '<path d="M4 20h16"/><path d="M7 20v-6M12 20V9M17 20v-9"/><path d="M12 4.5v4M9.9 6.6L12 4.5l2.1 2.1"/>',
            /* ---- WORLD ---- */
            'FastPlace':        '<rect x="8.5" y="8.5" width="9" height="9" rx="1.5"/><path d="M16.5 5h4M18.5 3v4"/><path d="M3 9h3.5M3 13h3M3 17h3.5"/>'
        };
        function iconSvg(name, cat){
            const inner = ICONS[name];
            if(inner) return SVGO + inner + '</svg>';
            // Monogram fallback for future modules
            const ch = (name||'?').replace(/[^A-Za-z0-9]/g,'').charAt(0).toUpperCase() || '?';
            return SVGO + '<text x="12" y="16" text-anchor="middle" font-size="11" font-weight="700" fill="currentColor" stroke="none" font-family="Inter,sans-serif">' + ch + '</text></svg>';
        }
        const NAV_ICONS = {
            panel:  '<rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M7 8.5h5M7 12.5h8M7 16.5h4"/>',
            market: '<path d="M4 7h16l-1.5 12.5a1.8 1.8 0 01-1.8 1.5H7.3a1.8 1.8 0 01-1.8-1.5z"/><path d="M8.5 10V6a3.5 3.5 0 017 0v4"/>',
            stats:  '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2" transform="translate(-0.5 0)"/>',
            license:'<path d="M12 2.8l2.6 5.4 5.9.8-4.3 4.1 1 5.9-5.2-2.8-5.2 2.8 1-5.9L3.5 9l5.9-.8z"/>',
            help:   '<circle cx="12" cy="12" r="8.5"/><path d="M9.4 9.2a2.7 2.7 0 015.2 1c0 1.8-2.6 2.2-2.6 3.8"/><path d="M12 17.5h.01"/>'
        };
        // Rail pages — only the panel is real today; the rest are shells for
        // server-backed features (market/stats/license/help), per the reference layout.
        const PAGES = [
            { id:'panel',  label:'模块配置', icon:'panel',   real:true },
            { id:'market', label:'配置市场', icon:'market',  badge:'SOON' },
            { id:'stats',  label:'使用统计', icon:'stats',   badge:'SOON' },
            { id:'license',label:'授权更新', icon:'license', badge:'SOON' },
            { id:'help',   label:'帮助中心', icon:'help',    badge:'SOON' }
        ];

        let toastTimer = null;
        function toast(msg){
            let el = document.getElementById('toast');
            if(!el){ el = document.createElement('div'); el.id='toast'; document.body.appendChild(el); }
            el.innerHTML = '<span class="t-dot">◈</span>' + msg;
            requestAnimationFrame(()=>el.classList.add('show'));
            clearTimeout(toastTimer);
            toastTimer = setTimeout(()=>el.classList.remove('show'), 2000);
        }

        let modules = [];
        let token = localStorage.getItem('doppel_token') || '';
        let activeCat = 'COMBAT';

        // ----- Expanded-state persistence (per module name) -----
        let expandedSet = new Set();

        // ----- Smoothness guards -----
        // lastModulesSig: full-rebuild only when the module COMPOSITION changes;
        //   pure value/toggle diffs are patched into the live DOM instead (no refresh glitch).
        // lastRenderedCat: play the fluid entrance animation only on real category switches.
        let lastModulesSig = '';
        let lastRenderedCat = '';

        // ----- Interaction guard -----
        // While the user is dragging a slider / holding pointer inside a card, the poll
        // must NOT rebuild (or even patch) the DOM — that was the "drag = refresh" bug.
        let interacting = false;
        let interactTimer = 0;
        let pendingRaw = null;

        // ----- API helpers -----
        function authHeaders(){
            return token ? { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' }
                         : { 'Content-Type': 'application/json' };
        }
        async function api(url, opts){
            const r = await fetch(url, Object.assign({headers:authHeaders()}, opts));
            if(r.status === 401){ ensureToken(); throw new Error('unauthorized'); }
            if(!r.ok) throw new Error(r.status);
            return r.json();
        }
        async function ensureToken(){
            if(token) return;
            try {
                const info = await fetch('/api/info').then(r=>r.json());
                if(info.defaultPassword){ token = info.defaultPassword; localStorage.setItem('doppel_token', token); return; }
            } catch(e){}
            const t = prompt('Enter WebUI access token (see injector cmd / doppel-agent.log):');
            if(t){ token = t.trim(); localStorage.setItem('doppel_token', token); } else window.location.reload();
        }
        // ----- Sidebar and tabs -----
        function buildSideNav(){
            $('#sideNav').innerHTML = PAGES.map(p =>
                `<div class="nav-item ${p.real?'active':''}" data-page="${p.id}">
                    <span class="n-icon">${SVGO}${NAV_ICONS[p.icon]||''}</svg></span>
                    <span class="n-label">${p.label}</span>
                    ${p.badge?`<span class="badge">${p.badge}</span>`:''}
                </div>`
            ).join('');
            $$('#sideNav .nav-item').forEach(el => {
                el.addEventListener('click', () => {
                    if(el.dataset.page==='panel') return;
                    toast('该页面需要服务端支持 · Coming soon');
                });
            });
        }
        function buildTabs(){
            $('#tabBar').innerHTML = CATS.map(c =>
                `<div class="tab ${c===activeCat?'active':''}" data-cat="${c}">${CAT_TAB[c]||c}</div>`
            ).join('');
            $$('#tabBar .tab').forEach(el => {
                el.addEventListener('click', () => {
                    if(activeCat === el.dataset.cat) return;
                    activeCat = el.dataset.cat;
                    $$('#tabBar .tab').forEach(t=>t.classList.toggle('active', t.dataset.cat===activeCat));
                    lastRenderedCat = '';            // force entrance animation path
                    renderContent();
                });
            });
        }
        function updateTabVisibility(){
            $$('#tabBar .tab').forEach(t=>{
                const c = t.dataset.cat;
                t.style.display = modules.some(m=>m.category===c) ? '' : 'none';
            });
        }
        function updateEye(){
            const hud = modules.find(m=>m.name==='HUD');
            const eye = $('#eyeChip');
            if(eye && hud) eye.classList.toggle('off', !hud.enabled);
        }
        function setStatus(ok, n){
            $('#conn').textContent = ok ? '● Online · ' + (n!=null?n:modules.length) + ' modules' : '● Disconnected';
            const sc = $('#sideConn');
            if(sc) sc.innerHTML = ok
                ? '<span class="dot">●</span> Online<span class="sub">game link</span>'
                : '<span class="dot" style="color:#f87171">●</span> Disconnected<span class="sub">game link</span>';
        }

        // ----- Option visibility rules (cross-version + mode linkage) -----
        function versionOf(o){
            const n = (o.name||'');
            if(/19|1\.9|Cooldown|CritMode|CritStop|WeaponFilter|OnItemUse/.test(n)) return '19';
            if(/^18|1\.8|MaxCPS|MinCPS|ClickMode|^Mode$/.test(n)) return '18';
            return '';
        }
        function versionTag(o){
            const v = versionOf(o);
            if(v==='19') return '<span class="ver-tag v19">1.9+</span>';
            if(v==='18') return '<span class="ver-tag v18">1.8</span>';
            return '';
        }
        const MODE_RULES = {
            'Velocity': { selector:'Mode', groups:{ 'Legit':['HorizontalMin','HorizontalMax','VerticalMin','VerticalMax','Chance','OnlyOnHitFrame','NaturalMode','HitWindowMs','BaseChance','ChancePerHit','MaxChance','NthMin','NthMax'],
                                                    'Delay':['DelayMs','DelayTicks'],
                                                    'Click':['ClicksMin','ClicksMax','HurtTimeToClick','WhenFacingEnemyOnly','MaxAngleDifference','ClickRange'] } },
            'KeepSprint': { selector:'Mode', groups:{ 'Normal':['HorizontalKeep'],
                                                      'Legit':['MinReach','MaxReach','MinKeep','MaxKeep'] } },
            'SuperKnockback': { selector:'Mode', groups:{ } },
            'JumpReset': { selector:'CooldownMode', groups:{ 'Ticks':['TicksUntilJump'],
                                                             'ReceivedHits':['HitsUntilJump'] } },
            'AutoBlock': { selector:'Mode', groups:{ 'Switch':['SwitchOnRightHold'] } },
            'HitSelect': { selector:'Mode', groups:{ 'Retiming':['RetimeAt'],
                                                      'CounterHit':['CounterCD'] } }
        };
        function modeOf(o, rule){
            for(const [mode, opts] of Object.entries(rule.groups)){
                if(opts.includes(o.name)) return mode;
            }
            return '';
        }
        function modeTag(o, rule){
            const m = modeOf(o, rule);
            return m ? `<span class="ver-tag v19">${m}</span>` : '';
        }
        function optionsForModule(m){
            if(!m.options || m.options.length===0) return [];
            const cvOpt = m.options.find(o => o.name==='CombatVersion');
            const cv = cvOpt ? cvOpt.value : null;
            const rule = MODE_RULES[m.name];
            const selOpt = rule ? m.options.find(o => o.name===rule.selector) : null;
            const sel = selOpt ? selOpt.value : null;
            const naturalModeOpt = m.options.find(o => o.name==='NaturalMode');
            const nat = naturalModeOpt ? naturalModeOpt.value : null;
            const natIncr = (nat==='Both' || nat==='Incremental');
            const natNth  = (nat==='Both' || nat==='EveryNth');
            const trigModeOpt = m.options.find(o => o.name==='TriggerMode');
            return m.options.filter(o => {
                if(cvOpt && o.name==='CombatVersion') return true;
                if(cv && versionOf(o)!=='' && !(versionOf(o)==='18' && cv==='1.8') && !(versionOf(o)==='19' && cv==='1.9+')) return false;
                if(selOpt && o.name===rule.selector) return true;
                if(rule && sel){
                    const m2 = modeOf(o, rule);
                    if(m2!=='' && m2!==sel) return false;
                }
                if(m.name==='Velocity' && nat){
                    if((o.name==='BaseChance'||o.name==='ChancePerHit'||o.name==='MaxChance') && !natIncr) return false;
                    if((o.name==='NthMin'||o.name==='NthMax') && !natNth) return false;
                }
                if(trigModeOpt && o.name==='HurtTime') return trigModeOpt.value === 'HurtTimeExact';
                return true;
            });
        }
        function modeChipOf(m){
            const sel = ['Mode','CooldownMode','ClickMode','CombatVersion'];
            for(const s of sel){
                const o = (m.options||[]).find(x=>x.name===s);
                if(o){ const v = (o.value && o.value.name) ? o.value.name : o.value; if(v) return String(v); }
            }
            return '';
        }

        // ----- Option widgets -----
        function optionWidget(o, rule){
            const t = o.type;
            const key = o.key, val = o.value;
            if(t === 'CHOICES' || t === 'ENUM'){
                const label = (val && val.name) ? val.name : val;
                const opts = (o.choices||[]).map(c => `<option value="${c}" ${c===label?'selected':''}>${c}</option>`).join('');
                const tag = versionTag(o) + (rule ? modeTag(o, rule) : '');
                return `<div class="sub-row">
                    <span class="sub-label"><span class="opt-name">${o.name}</span>${tag}</span>
                    <select class="sub-select" data-key="${key}">${opts}</select>
                </div>`;
            }
            if(t === 'BOOLEAN'){
                const tag = versionTag(o) + (rule ? modeTag(o, rule) : '');
                return `<div class="sub-row">
                    <span class="sub-label"><span class="opt-name">${o.name}</span>${tag}</span>
                    <div class="toggle-switch ${val?'on':''}" data-key="${key}"><span class="pulse-ring"></span></div>
                </div>`;
            }
            if(t === 'FLOAT' || t === 'INT' || t === 'PROBABILITY'){
                let min = typeof o.min==='number'?o.min:0;
                let max = typeof o.max==='number'?o.max:100;
                if(min > max){ const tmp=min; min=max; max=tmp; }
                const v = Math.min(max, Math.max(min, typeof val==='number'?val:0));
                const pct = max>min?Math.round((v-min)/(max-min)*100):0;
                const unit = o.unit||'';
                const isDec = t==='FLOAT';
                const disp = isDec ? Number(v).toFixed(1) : v;
                return `<div class="slider-row">
                    <div class="slider-label-row">
                        <span class="opt-name" style="overflow:hidden;text-overflow:ellipsis">${o.name}</span>${versionTag(o)}${rule?modeTag(o,rule):''}
                        <span class="slider-value">${disp}${unit}</span>
                    </div>
                    <div class="slider-track" data-key="${key}" data-min="${min}" data-max="${max}" data-int="${isDec?0:1}" data-unit="${unit}" data-dec="${isDec?1:0}">
                        <div class="slider-fill" style="width:${pct}%;"></div>
                    </div>
                </div>`;
            }
            if(t === 'STRING'){
                return `<div class="sub-row"><span class="sub-label"><span class="opt-name">${o.name}</span></span><input class="text-input" data-key="${key}" data-str="1" value="${val||''}"></div>`;
            }
            return `<span class="noopts">—</span>`;
        }

        // ----- Card builder -----
        function controlsHtml(m){
            return `<span class="kb-chip" data-kb="${m.name}" title="点击后按任意键绑定（Esc 清除）">⏵ ${m.keyName||'未绑定'}</span>` +
                (m.hudEnabled ? `<span class="hud-chip ${m.hudHidden?'off':''}" data-hud="${m.name}" title="游戏内 HUD 显示开关">◉</span>` : '');
        }
        function moduleCard(m){
            const rule = MODE_RULES[m.name];
            const opts = optionsForModule(m).map(o => optionWidget(o, rule)).join('');
            const enabled = !!m.enabled;
            const expanded = expandedSet.has(m.name);
            const chip = modeChipOf(m);
            const controls = controlsHtml(m);
            return `<div class="setting-item ${expanded?'expanded':''}" data-mod="${m.name}" data-enabled="${enabled?'1':'0'}">
                <div class="setting-header">
                    <div class="setting-label">
                        <span class="mod-icon cat-${m.category||'MISC'}">${iconSvg(m.name, m.category)}</span>
                        <span class="m-name">${m.name}</span>
                        ${chip?`<span class="mode-chip">${chip}</span>`:''}
                    </div>
                    <div class="setting-right">
                        <div class="toggle-switch ${enabled?'on':''}" data-mod="${m.name}"><span class="pulse-ring"></span></div>
                    </div>
                </div>
                <div class="drawer-handle">⌄</div>
                <div class="sub-options">
                    <div class="sub-grid" data-options="${m.name}" data-optsig="${optionsForModule(m).map(o=>o.key).join('|')}">
                        <div class="sub-actions">${controls}</div>
                        ${opts || '<span class="noopts">该模块没有可调参数</span>'}
                    </div>
                </div>
            </div>`;
        }

        // ----- Render (two columns) / patch (in-place) -----
        function renderContent(){
            const entering = lastRenderedCat !== activeCat;
            lastRenderedCat = activeCat;
            const filtered = modules.filter(m => m.category === activeCat);
            const left  = filtered.filter((_, i) => i % 2 === 0);
            const right = filtered.filter((_, i) => i % 2 === 1);
            const col = list => list.map(m => moduleCard(m)).join('');
            $('#tabContent').innerHTML = `
                <div class="module-grid${entering ? ' enter' : ''}">
                    <div class="module-column">
                        <div class="setting-grid">${col(left) || '<div class="empty">该分类暂无模块</div>'}</div>
                    </div>
                    <div class="module-column">
                        <div class="setting-grid">${col(right) || '<div class="empty">该分类暂无模块</div>'}</div>
                    </div>
                </div>`;
        }

        // Patch the live DOM instead of rebuilding — this is what kills the
        // "poll yanks my card around" feeling while keeping values in sync.
        function patchContent(){
            $$('#tabContent .setting-item[data-mod]').forEach(card => {
                const m = modules.find(x => x.name === card.dataset.mod);
                if(!m) return;
                // master toggle + enabled state
                card.dataset.enabled = m.enabled ? '1' : '0';
                const sw = card.querySelector('.toggle-switch[data-mod]');
                if(sw) sw.classList.toggle('on', !!m.enabled);
                // mode chip
                const chip = modeChipOf(m);
                const chipEl = card.querySelector('.mode-chip');
                if(chip && chipEl && chipEl.textContent !== chip) chipEl.textContent = chip;
                else if(chip && !chipEl){
                    const lbl = card.querySelector('.setting-label .m-name');
                    if(lbl) lbl.insertAdjacentHTML('afterend', `<span class="mode-chip">${chip}</span>`);
                } else if(!chip && chipEl) chipEl.remove();
                // drawer controls (keybind / hud) — never touch a capturing chip
                const kb = card.querySelector('.kb-chip[data-kb]');
                if(kb && !kb.classList.contains('capturing') && !capturingKey)
                    kb.textContent = '⏵ ' + (m.keyName||'未绑定');
                const hudc = card.querySelector('.hud-chip[data-hud]');
                if(hudc) hudc.classList.toggle('off', !!m.hudHidden);
                // options: rebuild only when the VISIBLE option set changed (mode swap etc.)
                const grid = card.querySelector('.sub-grid[data-options]');
                if(!grid) return;
                const wantSig = optionsForModule(m).map(o=>o.key).join('|');
                if(grid.dataset.optsig !== wantSig){
                    const rule = MODE_RULES[m.name];
                    grid.dataset.optsig = wantSig;
                    grid.innerHTML =
                        `<div class="sub-actions">${controlsHtml(m)}</div>` +
                        (optionsForModule(m).map(o => optionWidget(o, rule)).join('') || '<span class="noopts">该模块没有可调参数</span>');
                    if(card.classList.contains('expanded')){
                        const so = card.querySelector('.sub-options');
                        so.style.maxHeight = (so.scrollHeight + 80) + 'px';
                    }
                    return;
                }
                // same option set: patch widget values in place (skip focused element)
                (m.options||[]).forEach(o => {
                    const w = grid.querySelector(`[data-key="${o.key}"]`);
                    if(!w || w === document.activeElement) return;
                    if(w.classList.contains('toggle-switch')){
                        w.classList.toggle('on', !!o.value);
                    } else if(w.tagName === 'SELECT'){
                        const label = (o.value && o.value.name) ? o.value.name : o.value;
                        if(w.value !== label) w.value = label;
                    }
                    const row = w.closest('.slider-row');
                    if(row){
                        let min = typeof o.min==='number'?o.min:0, max = typeof o.max==='number'?o.max:100;
                        if(min>max){ const t=min; min=max; max=t; }
                        const v = Math.min(max, Math.max(min, typeof o.value==='number'?o.value:0));
                        const isDec = w.dataset.dec==='1';
                        const pct = max>min?Math.round((v-min)/(max-min)*100):0;
                        const fill = row.querySelector('.slider-fill');
                        if(fill) fill.style.width = pct+'%';
                        const sv = row.querySelector('.slider-value');
                        if(sv) sv.textContent = (isDec?Number(v).toFixed(1):v) + (o.unit||'');
                    }
                });
            });
            updateEye();
        }

        // ----- Refresh (poll) -----
        async function refresh(){
            await ensureToken();
            try {
                const raw = await api('/api/modules');
                setStatus(true, raw.length);
                if(interacting){ pendingRaw = raw; return; }   // hands off the UI mid-interaction
                applyData(raw);
            } catch(e) {
                setStatus(false);
            }
        }
        function applyData(raw){
            modules = [...new Map(raw.map(m => [m.name, m])).values()];
            const sig = modules.map(m => m.name + ':' + m.category).join('|');
            updateTabVisibility();
            updateEye();
            if(sig !== lastModulesSig){
                lastModulesSig = sig;
                renderContent();
            } else {
                patchContent();
            }
        }

        // ----- Interaction guard -----
        window.addEventListener('pointerdown', e => {
            if(e.target.closest('.setting-item, .slider-track, select, input, textarea')){
                interacting = true;
                clearTimeout(interactTimer);
            }
        });
        window.addEventListener('pointerup', () => {
            clearTimeout(interactTimer);
            interactTimer = setTimeout(() => {
                interacting = false;
                if(pendingRaw){ const r = pendingRaw; pendingRaw = null; applyData(r); }
            }, 200);
        });
        window.addEventListener('blur', () => { interacting = false; });

        // ----- Clicks -----
        let capturingKey = null;
        document.addEventListener('click', async e => {
            // HUD visibility chip (inside drawer)
            const hudChip = e.target.closest('.hud-chip[data-hud]');
            if(hudChip){
                const name = hudChip.dataset.hud;
                const cur = !hudChip.classList.contains('off');
                hudChip.classList.toggle('off', cur);
                await api('/api/modules/'+encodeURIComponent(name)+'/hud', {method:'POST', body:JSON.stringify({hidden:cur})});
                refresh();
                e.stopPropagation(); return;
            }
            // Keybind chip
            const kb = e.target.closest('.kb-chip[data-kb]');
            if(kb){
                capturingKey = kb.dataset.kb;
                $$('.kb-chip').forEach(c=>c.classList.remove('capturing'));
                kb.classList.add('capturing');
                kb.textContent = '⏵ 按任意键… (Esc 清除)';
                return;
            }
            // Panic bar (two-step arm, no accidental wipes)
            if(e.target.closest('#panicBar')){
                const bar = $('#panicBar');
                if(!bar.classList.contains('arm')){
                    bar.classList.add('arm');
                    $('#panicSub').textContent = '再点一次确认 · 关闭全部模块';
                    setTimeout(() => { bar.classList.remove('arm'); $('#panicSub').textContent = '一键全关 · 恢复原版外观'; }, 2600);
                } else {
                    panic();
                }
                return;
            }
            // Eye — toggle HUD module
            if(e.target.closest('#eyeChip')){
                const hud = modules.find(m=>m.name==='HUD');
                if(!hud){ toast('未找到 HUD 模块'); return; }
                await api('/api/modules/HUD/toggle', {method:'POST'});
                refresh(); return;
            }
            // Config manager / market buttons
            if(e.target.closest('#cfgBtn')){ openCfg(); return; }
            if(e.target.closest('#marketBtn')){ toast('配置市场需要服务端支持 · Coming soon'); return; }
            // Modal close paths
            if(e.target.closest('#cfgClose') || e.target.id === 'cfgModal'){ $('#cfgModal').classList.remove('show'); return; }
            if(e.target.closest('#cfgReload')){ fillCfg(); return; }
            if(e.target.closest('#cfgCopy')){
                const ta = $('#cfgText');
                ta.select();
                try { await navigator.clipboard.writeText(ta.value); toast('配置已复制到剪贴板'); }
                catch(err){ document.execCommand('copy'); toast('配置已复制'); }
                return;
            }
            if(e.target.closest('#cfgImport')){
                const body = $('#cfgText').value;
                if(!body.trim()){ toast('先粘贴配置 JSON'); return; }
                try {
                    await api('/api/config', {method:'POST', body});
                    toast('配置已导入 · 热载完成');
                    $('#cfgModal').classList.remove('show');
                    refresh();
                } catch(err){ toast('导入失败 · JSON 无效?'); }
                return;
            }
            // Sub-option toggle
            const subSw = e.target.closest('.sub-grid .toggle-switch[data-key]');
            if(subSw){
                subSw.classList.toggle('on');
                await api('/api/options', {method:'POST', body:JSON.stringify({key:subSw.dataset.key, value:subSw.classList.contains('on')})});
                refresh(); return;
            }
            // Module master toggle
            const modSw = e.target.closest('.setting-header .toggle-switch[data-mod]');
            if(modSw){
                modSw.classList.toggle('on');
                await api('/api/modules/'+encodeURIComponent(modSw.dataset.mod)+'/toggle', {method:'POST'});
                refresh();
                e.stopPropagation(); return;
            }
            // Slider click (single tap positions the value; drag handled below)
            const srow = e.target.closest('.slider-track[data-key]');
            if(srow){
                const rect = srow.getBoundingClientRect();
                commitSlider(srow, Math.max(0, Math.min(1, (e.clientX-rect.left)/rect.width)));
                return;
            }
            // Expand/collapse — the push-the-table drawer
            const header = e.target.closest('.setting-header');
            const handle = e.target.closest('.drawer-handle');
            if(header || handle){
                const card = (header||handle).closest('.setting-item');
                if(!card) return;
                if(header && e.target.closest('.toggle-switch')) return;
                const m = modules.find(x => x.name === card.dataset.mod);
                if(!m) return;
                const so = card.querySelector('.sub-options');
                if(expandedSet.has(m.name)){
                    expandedSet.delete(m.name);
                    card.classList.remove('expanded');
                    if(so) so.style.maxHeight = '0px';
                } else {
                    expandedSet.add(m.name);
                    card.classList.add('expanded');
                    if(so) so.style.maxHeight = (so.scrollHeight + 80) + 'px';
                }
                return;
            }
        });

        // ----- Selects -----
        document.addEventListener('change', async e => {
            const sel = e.target.closest('.sub-select[data-key]');
            if(sel){
                await api('/api/options', {method:'POST', body:JSON.stringify({key:sel.dataset.key, value:sel.value})});
                refresh(); return;
            }
            const num = e.target.closest('.num-input[data-key]');
            if(num){ postNumber(num); refresh(); return; }
            const txt = e.target.closest('.text-input[data-key]');
            if(txt){
                await api('/api/options', {method:'POST', body:JSON.stringify({key:txt.dataset.key, value:txt.value})});
            }
        });

        // ----- Numeric inputs (debounced; no per-keystroke refresh) -----
        let numTimers = {};
        document.addEventListener('input', e => {
            const num = e.target.closest('.num-input[data-key]');
            if(!num) return;
            const row = num.closest('.slider-row');
            const v = clampNumber(num);
            if(row){
                const min=+num.dataset.min, max=+num.dataset.max;
                const pct = max>min?Math.round((v-min)/(max-min)*100):0;
                const fill = row.querySelector('.slider-fill');
                if(fill) fill.style.width = pct+'%';
                const sv = row.querySelector('.slider-value');
                if(sv) sv.textContent = v + (num.dataset.unit||'');
            }
            clearTimeout(numTimers[num.dataset.key]);
            numTimers[num.dataset.key] = setTimeout(() => postNumber(num), 300);
        });
        function clampNumber(num){
            const min=+num.dataset.min, max=+num.dataset.max, isDec=num.dataset.dec==='1';
            let v = isDec ? parseFloat(num.value) : parseInt(num.value,10);
            if(isNaN(v)) v = min;
            v = Math.min(max, Math.max(min, v));
            if(isDec) v = Math.round(v*10)/10;
            return v;
        }
        async function postNumber(num){
            const v = clampNumber(num);
            await api('/api/options', {method:'POST', body:JSON.stringify({key:num.dataset.key, value:v})});
        }

        // ----- Slider drag (live; throttled POST; refresh only on release) -----
        function commitSlider(srow, x){
            let min=+srow.dataset.min, max=+srow.dataset.max, isDec=srow.dataset.dec==='1';
            if(min>max){ const tmp=min; min=max; max=tmp; }
            const raw = min + x*(max-min);
            const v = isDec ? Math.round(raw*10)/10 : Math.round(raw);
            const fill = srow.querySelector('.slider-fill');
            if(fill) fill.style.width=(x*100)+'%';
            const val = srow.parentElement.querySelector('.slider-value');
            if(val) val.textContent = v+(srow.dataset.unit||'');
            api('/api/options', {method:'POST', body:JSON.stringify({key:srow.dataset.key, value:v})});
            return v;
        }
        document.addEventListener('mousedown', e => {
            const srow = e.target.closest('.slider-track[data-key]');
            if(!srow) return;
            e.preventDefault();
            let last = 0, evLast = e;
            const drag = ev => {
                const rect = srow.getBoundingClientRect();
                const x = Math.max(0, Math.min(1, (ev.clientX-rect.left)/rect.width));
                const now = performance.now();
                if(now - last > 60){ last = now; commitSlider(srow, x); }
                else {
                    const fill = srow.querySelector('.slider-fill');
                    if(fill) fill.style.width=(x*100)+'%';
                }
            };
            drag(e);
            const moveCap = ev => { evLast = ev; drag(ev); };
            const up = () => {
                document.removeEventListener('mousemove', moveCap);
                document.removeEventListener('mouseup', up);
                const rect = srow.getBoundingClientRect();
                const x = Math.max(0, Math.min(1, (evLast.clientX-rect.left)/rect.width));
                commitSlider(srow, x);
                refresh();
            };
            document.addEventListener('mousemove', moveCap);
            document.addEventListener('mouseup', up);
        });

        // ----- Panic: disable everything, restore the vanilla look -----
        let panicking = false;
        async function panic(){
            if(panicking) return;
            panicking = true;
            const on = modules.filter(m => m.enabled);
            toast('PANIC · 关闭 ' + on.length + ' 个模块');
            for(const m of on){
                try { await api('/api/modules/'+encodeURIComponent(m.name)+'/toggle', {method:'POST'}); } catch(err){}
            }
            panicking = false;
            refresh();
        }
        document.addEventListener('keydown', e => {
            if(e.shiftKey && e.key === 'Delete'){ e.preventDefault(); panic(); return; }
            if(!capturingKey) return;
            e.preventDefault();
            const name = capturingKey;
            let code = -1;
            if(e.key === 'Escape'){ code = -1; }
            else if(e.key === 'Shift') code = 340;
            else if(e.key === 'Control') code = 341;
            else if(e.key === 'Alt') code = 342;
            else if(e.key === ' ') code = 32;
            else if(e.key === 'Enter') code = 257;
            else if(e.key === 'Tab') code = 258;
            else if(/^[a-zA-Z]$/.test(e.key)) code = e.key.toUpperCase().charCodeAt(0);
            else if(/^[0-9]$/.test(e.key)) code = e.key.charCodeAt(0);
            else if(/^F([1-9]|1[0-2])$/.test(e.key)) code = 290 + (parseInt(e.key.slice(1),10) - 1);
            else return;
            capturingKey = null;
            (async () => {
                try {
                    const r = await api('/api/modules/'+encodeURIComponent(name)+'/keybind', {method:'POST', body:JSON.stringify({key:code})});
                    const chip = document.querySelector(`.kb-chip[data-kb="${name}"]`);
                    if(chip){ chip.classList.remove('capturing'); chip.textContent = '⏵ ' + (r.keyName||(code<=0?'未绑定':'键'+code)); }
                    refresh();
                } catch(err){}
            })();
        });

        // ----- Config manager modal -----
        async function fillCfg(){
            try {
                const txt = await fetch('/api/config', {headers:authHeaders()}).then(r=>r.text());
                let pretty = txt;
                try { pretty = JSON.stringify(JSON.parse(txt), null, 2); } catch(err){}
                $('#cfgText').value = pretty;
            } catch(err){ $('#cfgText').value = '// 载入失败（连接断开?）'; }
        }
        async function openCfg(){
            $('#cfgModal').classList.add('show');
            await fillCfg();
        }

        // ----- Init -----
        buildSideNav();
        buildTabs();
        refresh();
        setInterval(refresh, 3000);

        // Connection info (urls + token bootstrap)
        try {
            fetch('/api/info').then(r=>r.json()).then(info=>{
                if(info.urls && info.urls.length){
                    $('#urls').innerHTML = info.urls.map(u=>`<span class="bd">${u}</span>`).join('');
                }
                if(info.defaultPassword){ token=info.defaultPassword; localStorage.setItem('doppel_token', token); }
            });
        } catch(e){}
</script>
</body>
</html>
