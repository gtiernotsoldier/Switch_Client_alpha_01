[package]
name = "switchlite-injector"
version = "0.1.0-alpha"
edition = "2021"
description = "SwitchLite Rust-led injector — C++ payload.dll stays for the in-process JNI attach"

[[bin]]
name = "switchlite-injector"
path = "src/main.rs"

[dependencies]
# Zero third-party deps: we call the handful of kernel32 functions we need via
# raw extern "system" FFI. This avoids windows-sys version/feature conflicts
# that cost many CI round-trips.

[profile.release]
opt-level = 2
