<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwitchLite · Aurora 模块控制台</title>
    <style>
        /* ===== 全局重置 & Aurora 基础 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            user-select: none;
        }
        body {
            background: #0A0A0F;
            min-height: 100vh;
            display: flex;
            background-image: radial-gradient(circle at 20% 30%, rgba(255, 122, 0, 0.06) 0%, transparent 40%),
                              radial-gradient(circle at 80% 70%, rgba(255, 0, 85, 0.06) 0%, transparent 40%);
            overflow: hidden;
            color: #fff;
        }
        /* ===== 侧边栏 (毛玻璃) ===== */
        .sidebar {
            width: 200px;
            background: rgba(20, 20, 30, 0.6);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-right: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            flex-direction: column;
            padding: 24px 0 20px 0;
            flex-shrink: 0;
            height: 100vh;
            position: relative;
            z-index: 10;
            box-shadow: 4px 0 40px rgba(0,0,0,0.4);
        }
        .sidebar-brand { padding: 0 20px 18px 20px; border-bottom: 1px solid rgba(255,255,255,0.04); margin-bottom: 12px; }
        .sidebar-brand .brand-text {
            font-size: 16px; font-weight: 600;
            background: linear-gradient(135deg, #FF7A00, #FF0055);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 0.02em;
        }
        .sidebar-brand .brand-sub { font-size: 10px; color: rgba(255,255,255,0.2); margin-top: 2px; }
        .nav-menu { flex: 1; overflow-y: auto; padding: 0 10px; }
        .nav-item {
            display: flex; align-items: center; padding: 10px 14px; margin: 2px 0; border-radius: 10px;
            font-size: 14px; color: rgba(255,255,255,0.5); cursor: pointer; transition: all 0.2s ease; position: relative;
        }
        .nav-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
        .nav-item.active {
            background: linear-gradient(135deg, rgba(255, 122, 0, 0.2), rgba(255, 0, 85, 0.15));
            color: #fff; box-shadow: 0 0 30px rgba(255, 122, 0, 0.05); border: 1px solid rgba(255, 122, 0, 0.15);
        }
        .nav-item .icon { margin-right: 12px; font-size: 16px; width: 22px; text-align: center; opacity: 0.6; }
        .nav-item.active .icon { opacity: 1; }
        .nav-item .badge {
            font-size: 9px; background: rgba(255, 122, 0, 0.3); padding: 1px 8px; border-radius: 40px;
            margin-left: auto; color: rgba(255,255,255,0.7); border: 1px solid rgba(255, 122, 0, 0.1);
        }
        .sidebar-divider { border-top: 1px solid rgba(255,255,255,0.05); margin: 8px 14px; }
        .sidebar-foot { padding: 12px 20px; border-top: 1px solid rgba(255,255,255,0.03); font-size: 10px; color: rgba(255,255,255,0.1); text-align: center; }
        /* ===== 主体 ===== */
        .main-content { flex: 1; display: flex; flex-direction: column; padding: 28px 40px 20px 40px; overflow-y: auto; height: 100vh; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .header-title {
            font-size: 20px; font-weight: 600;
            background: linear-gradient(135deg, #FF7A00, #FF0055);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .header-status {
            color: #4ade80; font-size: 13px; background: rgba(74, 222, 128, 0.08);
            padding: 4px 14px; border-radius: 40px; border: 1px solid rgba(74, 222, 128, 0.15);
        }
        .header-shortcut {
            background: rgba(255,255,255,0.04); padding: 5px 14px; border-radius: 6px; font-size: 12px;
            color: rgba(255,255,255,0.3); border: 1px solid rgba(255,255,255,0.06); font-family: 'SF Mono', monospace;
        }
        /* ===== 标签栏 (Tabs) ===== */
        .tab-bar { display: flex; background: rgba(255,255,255,0.03); border-radius: 12px; padding: 4px; width: fit-content; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.04); flex-wrap: wrap; }
        .tab {
            padding: 8px 22px; color: rgba(255,255,255,0.4); font-size: 14px; cursor: pointer;
            border-radius: 8px; transition: all 0.2s; font-weight: 450;
        }
        .tab:hover { color: #fff; background: rgba(255,255,255,0.04); }
        .tab.active { color: #fff; background: rgba(255, 122, 0, 0.15); box-shadow: inset 0 -2px 0 #FF7A00; }

        .tab-content { flex: 1; }

        /* ===== 双列容器 ===== */
        .module-grid {
            display: flex;
            gap: 16px;
            align-items: flex-start;
        }
        .module-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* ===== 设置列表（每列内部的垂直列表） ===== */
        .setting-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }
        /* ===== 核心设置项 (可展开) ===== */
        .setting-item {
            background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border-radius: 16px; border: 1px solid rgba(255,255,255,0.08); overflow: hidden;
            transition: border-color 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
                        background 0.3s ease,
                        box-shadow 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .setting-item:hover { background: rgba(255,255,255,0.09); border-color: rgba(255,255,255,0.12); }
        .setting-item.expanded {
            border-color: rgba(255, 122, 0, 0.45);
            background: rgba(26, 26, 38, 0.55);
            box-shadow: 0 8px 40px rgba(255, 122, 0, 0.15);
        }
        .setting-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; cursor: pointer; transition: background 0.2s; }
        .setting-header:hover { background: rgba(255,255,255,0.05); }
        .setting-label { display: flex; align-items: center; gap: 10px; font-size: 15px; color: rgba(255,255,255,0.92); pointer-events: none; }
        .setting-tag {
            font-size: 10px; color: rgba(255, 150, 60, 0.85); background: rgba(255, 122, 0, 0.12);
            padding: 2px 10px; border-radius: 30px; border: 1px solid rgba(255, 122, 0, 0.12);
        }
        .setting-arrow {
            color: rgba(255,255,255,0.25); font-size: 14px; margin-left: 4px;
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: inline-block;
        }
        .setting-item.expanded .setting-arrow { transform: rotate(180deg); }
        .setting-right { display: flex; align-items: center; gap: 10px; pointer-events: auto; }
        .keybind-chip {
            font-size: 10px; color: rgba(255,122,0,0.85); background: rgba(255,122,0,0.08);
            padding: 2px 10px; border-radius: 30px; border: 1px solid rgba(255,122,0,0.15);
            cursor: pointer; white-space: nowrap; transition: 0.2s; font-family:'SF Mono',monospace;
        }
        .keybind-chip:hover { background: rgba(255,122,0,0.18); }
        .keybind-chip.capturing { background: rgba(255,0,85,0.18); border-color: rgba(255,0,85,0.4); color:#fff; animation: pulse-glow 1s infinite; }
        /* ===== 胶囊开关 (暖色) ===== */
        .toggle-switch {
            width: 38px; height: 20px; background: rgba(255,255,255,0.08); border-radius: 40px;
            position: relative; cursor: pointer; transition: background 0.3s, box-shadow 0.3s; flex-shrink: 0;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }
        .toggle-switch::after {
            content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; background: #fff;
            border-radius: 50%; transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.3s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        .toggle-switch.on { background: linear-gradient(135deg, #FF7A00, #FF0055); box-shadow: 0 0 24px rgba(255, 122, 0, 0.3); }
        .toggle-switch.on::after { transform: translateX(18px); }
        .toggle-switch .pulse-ring { position: absolute; top: -4px; left: -4px; right: -4px; bottom: -4px; border-radius: 40px; border: 1px solid transparent; pointer-events: none; transition: border-color 0.3s; }
        .toggle-switch.on .pulse-ring { border-color: rgba(255, 122, 0, 0.3); animation: pulse-glow 2.5s infinite ease-in-out; }
        @keyframes pulse-glow { 0% { opacity: 0.4; transform: scale(1); } 50% { opacity: 1; transform: scale(1.12); } 100% { opacity: 0.4; transform: scale(1); } }
        /* ===== 展开的子选项面板 ===== */
        .sub-options {
            max-height: 0;
            opacity: 0;
            visibility: hidden;
            transition: max-height 0.5s cubic-bezier(0.34, 1.0, 0.64, 1),
                        opacity 0.4s ease,
                        padding 0.4s ease,
                        border-color 0.3s ease;
            padding: 0 16px;
            border-top: 1px solid transparent;
            overflow: hidden;
        }
        .setting-item.expanded .sub-options {
            max-height: 2400px;
            opacity: 1;
            visibility: visible;
            padding: 14px 20px 20px 20px;
            border-top: 1px solid rgba(255,255,255,0.06);
        }

        /* 子项内部渐入 */
        .sub-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px 16px;
            transform: translateY(-6px);
            opacity: 0;
            transition: transform 0.4s cubic-bezier(0.34, 1.0, 0.64, 1),
                        opacity 0.4s ease;
        }
        .setting-item.expanded .sub-grid {
            transform: translateY(0);
            opacity: 1;
        }

        .sub-item { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 13.5px; color: rgba(255,255,255,0.85); padding: 4px 0; }
        .sub-item .sub-label { display: flex; align-items: center; gap: 6px; white-space: nowrap; min-width: 0; }
        .sub-item .sub-label .opt-name { overflow: hidden; text-overflow: ellipsis; }
        .ver-tag { font-size: 9px; padding: 1px 6px; border-radius: 20px; font-family:'SF Mono',monospace; }
        .ver-tag.v19 { color:#7dd3fc; background:rgba(56,189,248,0.12); border:1px solid rgba(56,189,248,0.2); }
        .ver-tag.v18 { color:#fca5a5; background:rgba(248,113,113,0.12); border:1px solid rgba(248,113,113,0.2); }
        .sub-select {
            background: rgba(255,255,255,0.09); color: #fff; border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px; padding: 4px 8px; font-size: 12.5px; cursor: pointer;
            max-width: 170px; transition: 0.2s;
        }
        .sub-select:hover { border-color: rgba(255,122,0,0.4); }
        .sub-select:focus { outline: none; border-color: rgba(255,122,0,0.5); }
        .sub-select option { background: #16161e; color:#fff; }
        .sub-value { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
        .num-input {
            width: 56px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 6px; color: #fff; padding: 3px 6px; font-size: 12px; text-align: center; transition: 0.2s;
        }
        .num-input:focus { outline: none; border-color: rgba(255, 122, 0, 0.4); }
        .text-input { flex: 1; min-width: 90px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); border-radius: 6px; color: #fff; padding: 3px 8px; font-size: 12px; }
        /* 滑块 */
        .slider-row { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 4px; margin: 4px 0; }
        .slider-label-row { display: flex; justify-content: space-between; font-size: 13px; color: rgba(255,255,255,0.6); }
        .slider-label-row .slider-value { color: rgba(255, 122, 0, 0.8); font-weight: 500; }
        .slider-track { width: 100%; height: 6px; background: rgba(255,255,255,0.08); border-radius: 6px; position: relative; cursor: pointer; }
        .slider-fill { height: 100%; border-radius: 6px; background: linear-gradient(90deg, #FF7A00, #FF0055); transition: width 0.15s; box-shadow: 0 0 12px rgba(255, 122, 0, 0.2); }
        .empty { font-size: 12px; color: rgba(255,255,255,0.25); padding: 16px; text-align: center; }
        .noopts { font-size: 11px; color: rgba(255,255,255,0.2); font-style: italic; }
        .sub-actions { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
        .mini-btn { font-size: 10px; padding: 3px 10px; border-radius: 30px; border: 1px solid rgba(255,122,0,0.15); color: rgba(255,122,0,0.7); background: rgba(255,122,0,0.06); cursor: pointer; }
        .mini-btn:hover { background: rgba(255,122,0,0.12); }
        /* 底部字幕 */
        .subtitle-overlay {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.5); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            padding: 8px 20px; border-radius: 40px; color: rgba(255,255,255,0.5); font-size: 13px;
            border: 1px solid rgba(255,255,255,0.04); white-space: nowrap; z-index: 100; font-weight: 300;
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
        @media (max-width: 820px) {
            .sidebar { width: 160px; }
            .main-content { padding: 20px; }
            .module-grid { flex-direction: column; }
            .sub-grid { grid-template-columns: 1fr; }
        }
        @media (max-width: 500px) { .sidebar { display: none; } .subtitle-overlay { white-space: normal; font-size: 12px; } }
        .tokbar { font-size: 10px; color: rgba(255,255,255,0.35); margin-bottom: 12px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
        .tokbar .bd { background: rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08); padding:2px 10px; border-radius:40px; font-family:'SF Mono',monospace; }
    </style>
</head>
<body>
    <!-- ===== 侧边栏 (SwitchLite 分类导航) ===== -->
    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="brand-text">⚡ SwitchLite</div>
            <div class="brand-sub">Aurora · 极光</div>
        </div>
        <nav class="nav-menu" id="sideNav"></nav>
        <div class="sidebar-foot">v2.1 · 跨版本</div>
    </aside>

    <!-- ===== 主体 ===== -->
    <main class="main-content">
        <header class="header">
            <div class="header-left">
                <span class="header-title">SwitchLite</span>
                <span class="header-status" id="conn">● 连接中…</span>
            </div>
            <div style="display:flex; gap:8px; flex-wrap:wrap;" id="hdrShortcuts"></div>
        </header>

        <div class="tokbar" id="urls"></div>

        <div class="tab-bar" id="tabBar"></div>
        <div class="tab-content" id="tabContent"></div>
    </main>

    <div class="subtitle-overlay">SwitchLite · Aurora 调试面板 · 推桌子效果</div>

    <script>
        const $ = s => document.querySelector(s);
        const CATS = ['COMBAT','PLAYER','MOVEMENT','WORLD','RENDER','MISC'];
        const CAT_ICON = { COMBAT:'◉', PLAYER:'♟', MOVEMENT:'➤', WORLD:'◈', RENDER:'◧', MISC:'⋯' };
        const CAT_TAB = { COMBAT:'Combat', PLAYER:'Player', MOVEMENT:'Movement', WORLD:'World', RENDER:'Visual', MISC:'Misc' };

        let modules = [];
        let token = localStorage.getItem('sl_token') || '';
        let activeCat = 'COMBAT';

        // ----- 展开状态持久化（按模块名） -----
        // 跨 refresh 保持展开/折叠，避免 3 秒自动刷新把卡片重置成折叠。
        let expandedSet = new Set();

        // ----- 分组状态 -----
        let leftModules = [];
        let rightModules = [];

        // ----- API 相关（保持不变） -----
        function authHeaders(){
            return token ? { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' }
                         : { 'Content-Type': 'application/json' };
        }
        async function api(url, opts){
            const r = await fetch(url, Object.assign({headers:authHeaders()}, opts));
            if(r.status === 401){ ensureToken(); throw new Error('unauthorized'); }
            if(!r.ok) throw new Error(r.status);
            return r.json();
        }
        async function ensureToken(){
            if(token) return;
            try {
                const info = await fetch('/api/info').then(r=>r.json());
                if(info.defaultPassword){ token = info.defaultPassword; localStorage.setItem('sl_token', token); return; }
            } catch(e){}
            const t = prompt('输入 WebUI 访问口令（看注入 cmd / switchlite-agent.log）：');
            if(t){ token = t.trim(); localStorage.setItem('sl_token', token); } else window.location.reload();
        }

        // ----- 侧边栏和标签（保持不变） -----
        function buildSideNavAndTabs(){
            $('#sideNav').innerHTML = CATS.map(c => {
                const n = (modules.filter(m => m.category===c)).length;
                return `<div class="nav-item ${c===activeCat?'active':''}" data-cat="${c}">
                    <span class="icon">${CAT_ICON[c]||'◉'}</span> ${CAT_TAB[c]||c}
                    ${n?`<span class="badge">${n}</span>`:''}
                </div>`;
            }).join('');
            $('#tabBar').innerHTML = CATS.map(c =>
                `<div class="tab ${c===activeCat?'active':''}" data-cat="${c}">${CAT_TAB[c]||c}</div>`
            ).join('');
            document.querySelectorAll('#sideNav .nav-item, #tabBar .tab').forEach(el => {
                el.addEventListener('click', () => { activeCat = el.dataset.cat; renderNavActive(); renderContent(); });
            });
        }
        function renderNavActive(){
            document.querySelectorAll('#sideNav .nav-item').forEach(i=>i.classList.toggle('active', i.dataset.cat===activeCat));
            document.querySelectorAll('#tabBar .tab').forEach(t=>t.classList.toggle('active', t.dataset.cat===activeCat));
        }

        // ----- 渲染选项控件 -----
        // 跨版本提示：根据选项名猜测它属于 1.8 还是 1.9+，打上小标签区分。
        function versionTag(o){
            const n = (o.name||'');
            if(/19|1\.9|Cooldown/i.test(n)) return '<span class="ver-tag v19">1.9+</span>';
            if(/^18|1\.8|Legit18/i.test(n)) return '<span class="ver-tag v18">1.8</span>';
            return '';
        }
        function optionWidget(o){
            const t = o.type;
            const key = o.key, val = o.value;
            if(t === 'CHOICES' || t === 'ENUM'){
                const label = (val && val.name) ? val.name : val;
                const opts = (o.choices||[]).map(c => `<option value="${c}" ${c===label?'selected':''}>${c}</option>`).join('');
                return `<div class="sub-item">
                    <span class="sub-label"><span class="opt-name">${o.name}</span>${versionTag(o)}</span>
                    <select class="sub-select" data-key="${key}">${opts}</select>
                </div>`;
            }
            if(t === 'BOOLEAN'){
                return `<div class="sub-item">
                    <span class="sub-label"><span class="opt-name">${o.name}</span>${versionTag(o)}</span>
                    <div class="toggle-switch ${val?'on':''}" data-key="${key}"><span class="pulse-ring"></span></div>
                </div>`;
            }
            if(t === 'FLOAT' || t === 'INT' || t === 'PROBABILITY'){
                let min = typeof o.min==='number'?o.min:0;
                let max = typeof o.max==='number'?o.max:100;
                if(min > max){ const tmp=min; min=max; max=tmp; }
                const v = Math.min(max, Math.max(min, typeof val==='number'?val:0));
                const pct = max>min?Math.round((v-min)/(max-min)*100):0;
                const unit = o.unit||'';
                const isDec = t==='FLOAT';
                const disp = isDec ? Number(v).toFixed(1) : v;
                return `<div class="slider-row">
                    <div class="slider-label-row">
                        <span class="opt-name" style="overflow:hidden;text-overflow:ellipsis">${o.name}</span>
                        <span class="slider-value" style="white-space:nowrap">${disp}${unit}</span>
                    </div>
                    <div class="slider-track" data-key="${key}" data-min="${min}" data-max="${max}" data-int="${isDec?0:1}" data-unit="${unit}" data-dec="${isDec?1:0}">
                        <div class="slider-fill" style="width:${pct}%;"></div>
                    </div>
                    <input type="number" class="num-input" data-key="${key}" data-min="${min}" data-max="${max}" data-dec="${isDec?1:0}" data-unit="${unit}" value="${disp}" style="width:100%;margin-top:4px;">
                </div>`;
            }
            if(t === 'STRING'){
                return `<div style="display:flex; gap:6px; align-items:center; flex:1;"><span style="opacity:.4;white-space:nowrap">${o.name}</span><input class="text-input" data-key="${key}" data-str="1" value="${val||''}"></div>`;
            }
            return `<span class="noopts">—</span>`;
        }

        // ----- 单个模块卡片（使用 fullIndex 标识） -----
        function moduleCard(m, fullIndex){
            const opts = (m.options||[]).map(optionWidget).join('');
            const enabled = !!m.enabled;
            const expanded = expandedSet.has(m.name);
            return `<div class="setting-item ${expanded?'expanded':''}" data-fullindex="${fullIndex}" data-enabled="${enabled?'1':'0'}">
                <div class="setting-header" data-fullindex="${fullIndex}">
                    <div class="setting-label">
                        <span>${m.name}</span>
                        <span class="setting-tag">${m.category||''}</span>
                        <span class="setting-arrow">⌄</span>
                    </div>
                    <div class="setting-right">
                        <span class="keybind-chip" data-kb="${m.name}" title="点击设置触发键">⏵ ${m.keyName||'未绑定'}</span>
                        <div class="toggle-switch ${enabled?'on':''}" data-mod="${m.name}" data-fullindex="${fullIndex}"><span class="pulse-ring"></span></div>
                    </div>
                </div>
                <div class="sub-options">
                    <div class="sub-grid" data-options="${m.name}">${opts || '<span class="noopts">该模块暂无配置项</span>'}</div>
                </div>
            </div>`;
        }

        // ----- 渲染内容（双列） -----
        function renderContent(){
            // 过滤当前分类的模块
            const filtered = modules.filter(m => m.category === activeCat);
            // 按原始顺序（保持奇偶分组）
            const left = filtered.filter((_, i) => i % 2 === 0);
            const right = filtered.filter((_, i) => i % 2 === 1);

            // 存储到分组变量，用于后续展开更新（但我们将直接从 modules 读取状态）
            // 渲染时使用全量 modules 中的 expanded 状态
            const leftHtml = left.map((m, idx) => {
                const fullIndex = modules.indexOf(m);
                return moduleCard(m, fullIndex);
            }).join('');

            const rightHtml = right.map((m, idx) => {
                const fullIndex = modules.indexOf(m);
                return moduleCard(m, fullIndex);
            }).join('');

            const content = `
                <div class="module-grid">
                    <div class="module-column">
                        <div class="setting-grid">${leftHtml || '<div class="empty">该分类暂无模块</div>'}</div>
                    </div>
                    <div class="module-column">
                        <div class="setting-grid">${rightHtml || '<div class="empty">该分类暂无模块</div>'}</div>
                    </div>
                </div>
            `;
            $('#tabContent').innerHTML = content;
        }

        // ----- 刷新数据 -----
        async function refresh(){
            await ensureToken();
            try {
                const raw = await api('/api/modules');
                // 去重
                modules = [...new Map(raw.map(m => [m.name, m])).values()];
                // 展开状态由 expandedSet 独立维护，刷新不重置（不再强制 expanded=false）
                // 更新标签显示
                document.querySelectorAll('#tabBar .tab').forEach(t=>{
                    const c = t.dataset.cat;
                    t.style.display = modules.some(m=>m.category===c) ? '' : 'none';
                });
                buildSideNavAndTabs();
                renderContent();
                $('#conn').textContent = '● 在线 · ' + modules.length + ' 模块';
            } catch(e) {
                $('#conn').textContent = '● 未连接';
            }
        }

        // ----- 交互事件（修改为使用 fullindex 精确控制展开） -----
        let capturingKey = null;

        document.addEventListener('click', async e => {
            // 按键绑定 chip
            const kb = e.target.closest('.keybind-chip[data-kb]');
            if(kb){
                capturingKey = kb.dataset.kb;
                document.querySelectorAll('.keybind-chip').forEach(c=>c.classList.remove('capturing'));
                kb.classList.add('capturing');
                kb.textContent = '⏵ 按任意键… (Esc清除)';
                return;
            }

            // 模块主开关 (使用 data-fullindex)
            const modSw = e.target.closest('.setting-header .toggle-switch[data-mod]');
            if(modSw){
                const name = modSw.dataset.mod;
                await api('/api/modules/'+encodeURIComponent(name)+'/toggle', {method:'POST'});
                refresh();
                e.stopPropagation(); return;
            }

            // 子选项开关
            if(e.target.closest('.sub-grid .toggle-switch[data-key]')){
                const s = e.target.closest('.toggle-switch[data-key]');
                await api('/api/options', {method:'POST', body:JSON.stringify({key:s.dataset.key, value:!s.classList.contains('on')})});
                refresh(); return;
            }

            // 展开/折叠：点击卡片头部（排除内部控件）
            const header = e.target.closest('.setting-header[data-fullindex]');
            if(header && e.button === 0 && !e.target.closest('.toggle-switch') && !e.target.closest('.keybind-chip') && !e.target.closest('.sub-select')){
                const fullIndex = parseInt(header.dataset.fullindex, 10);
                const m = !isNaN(fullIndex) ? modules[fullIndex] : null;
                if(m){
                    if(expandedSet.has(m.name)) expandedSet.delete(m.name);
                    else expandedSet.add(m.name);
                    renderContent(); // 重新渲染（保留其它卡片的展开状态）
                }
                return;
            }
        });

        // 滑块 + 数值输入（保持不变，但注意它们内部没有 fullindex，暂时使用 key 定位）
        document.addEventListener('change', async e => {
            const sel = e.target.closest('.sub-select[data-key]');
            if(sel){
                await api('/api/options', {method:'POST', body:JSON.stringify({key:sel.dataset.key, value:sel.value})});
                refresh();
                return;
            }
        });
        document.addEventListener('input', async e => {
            const num = e.target.closest('.num-input[data-key]');
            if(num){
                const key = num.dataset.key, min=+num.dataset.min, max=+num.dataset.max, isDec=num.dataset.dec==='1';
                let v = isDec ? parseFloat(num.value) : parseInt(num.value,10);
                if(isNaN(v)) return;
                v = Math.min(max, Math.max(min, v));
                if(isDec) v = Math.round(v*10)/10;
                await api('/api/options', {method:'POST', body:JSON.stringify({key, value:v})});
                // 更新UI中的滑块显示（但重新渲染会丢失当前DOM状态，为保持流畅，我们用DOM操作更新）
                const row = num.closest('.slider-row');
                if(row){ const fill=row.querySelector('.slider-fill'), val=row.querySelector('.slider-value'), pct=max>min?Math.round((v-min)/(max-min)*100):0; fill.style.width=pct+'%'; val.textContent=v+(num.dataset.unit||''); }
                // 不刷新全页面，只刷新数据（但为了保持一致性，简单调用refresh）
                refresh();
                return;
            }
            const txt = e.target.closest('.text-input[data-key]');
            if(txt){
                await api('/api/options', {method:'POST', body:JSON.stringify({key:txt.dataset.key, value:txt.value})});
            }
        });

        // 滑块点击拖拽（使用 data-key 定位，但为了保持数据同步，不触发全刷新，只更新数值）
        document.addEventListener('mousedown', e => {
            const srow = e.target.closest('.slider-track[data-key]');
            if(!srow) return;
            e.preventDefault();
            const drag = (ev) => {
                const rect = srow.getBoundingClientRect();
                const x = Math.max(0, Math.min(1, (ev.clientX-rect.left)/rect.width));
                let min=+srow.dataset.min, max=+srow.dataset.max, isDec=srow.dataset.dec==='1';
                if(min>max){ const tmp=min; min=max; max=tmp; }
                const raw = min + x*(max-min);
                const v = isDec ? Math.round(raw*10)/10 : Math.round(raw);
                const fill = srow.querySelector('.slider-fill');
                if(fill) fill.style.width=(x*100)+'%';
                const val = srow.querySelector('.slider-value');
                if(val) val.textContent=v+(srow.dataset.unit||'');
                api('/api/options', {method:'POST', body:JSON.stringify({key:srow.dataset.key, value:v})});
            };
            drag(e);
            const move = ev => drag(ev);
            const up = () => { document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up); };
            document.addEventListener('mousemove', move);
            document.addEventListener('mouseup', up);
        });

        // 滑块点击（触摸）
        document.addEventListener('click', async e => {
            const srow = e.target.closest('.slider-track[data-key]');
            if(srow){
                const rect = srow.getBoundingClientRect();
                const x = Math.max(0, Math.min(1, (e.clientX-rect.left)/rect.width));
                let min=+srow.dataset.min, max=+srow.dataset.max, isDec=srow.dataset.dec==='1';
                if(min>max){ const tmp=min; min=max; max=tmp; }
                const raw = min + x*(max-min);
                const v = isDec ? Math.round(raw*10)/10 : Math.round(raw);
                await api('/api/options', {method:'POST', body:JSON.stringify({key:srow.dataset.key, value:v})});
                const fill = srow.querySelector('.slider-fill');
                if(fill) fill.style.width=(x*100)+'%';
                const val = srow.querySelector('.slider-value');
                if(val) val.textContent=v+(srow.dataset.unit||'');
                // 不刷新全页面，仅更新显示
                return;
            }
        });

        // 按键绑定捕获
        document.addEventListener('keydown', async e => {
            if(!capturingKey) return;
            e.preventDefault();
            const name = capturingKey;
            let code = -1;
            if(e.key === 'Escape'){ code = -1; }
            else if(e.key === 'Shift') code = 340;
            else if(e.key === 'Control') code = 341;
            else if(e.key === 'Alt') code = 342;
            else if(e.key === ' ') code = 32;
            else if(e.key === 'Enter') code = 257;
            else if(e.key === 'Tab') code = 258;
            else if(/^[a-zA-Z]$/.test(e.key)) code = e.key.toUpperCase().charCodeAt(0);
            else if(/^[0-9]$/.test(e.key)) code = e.key.charCodeAt(0);
            else if(/^F([1-9]|1[0-2])$/.test(e.key)) code = 290 + (parseInt(e.key.slice(1),10) - 1);
            else return;
            capturingKey = null;
            try {
                const r = await api('/api/modules/'+encodeURIComponent(name)+'/keybind', {method:'POST', body:JSON.stringify({key:code})});
                const chip = document.querySelector(`.keybind-chip[data-kb="${name}"]`);
                if(chip){ chip.classList.remove('capturing'); chip.textContent = '⏵ ' + (r.keyName||(code<=0?'未绑定':'键'+code)); }
                refresh();
            } catch(err){}
        });

        // 初始化
        refresh();
        setInterval(refresh, 3000);

        // 获取地址信息
        try {
            fetch('/api/info').then(r=>r.json()).then(info=>{
                if(info.urls && info.urls.length){
                    $('#urls').innerHTML = info.urls.map(u=>`<span class="bd">${u}</span>`).join('');
                }
                if(info.defaultPassword){ token=info.defaultPassword; localStorage.setItem('sl_token', token); }
            });
        } catch(e){}
    </script>
</body>
</html>
