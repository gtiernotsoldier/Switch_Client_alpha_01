[package]
name = "switchlite-injector"
version = "0.1.0-alpha"
edition = "2021"
description = "SwitchLite Rust-led injector — C++ payload.dll stays for the in-process JNI attach"

[[bin]]
name = "switchlite-injector"
path = "src/main.rs"

[dependencies]
# windows-sys 0.59: Win32_System aggregates every System_* submodule
# (Threading/Memory/Debug/LibraryLoader/ProcessStatus/...), Win32_Security
# provides SECURITY_ATTRIBUTES (needed by CreateEventA/CreateRemoteThread),
# Win32_UI_WindowsAndMessaging for EnumWindows (later step).
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Storage_FileSystem",
] }

[profile.release]
opt-level = 2
